<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>json Encrypt Tool</title>
  <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>-->
  <script src="/assets/home/js/bootstrap.js"></script>
  <script src="/assets/home/js/jquery-3.7.1.min.js"></script>
  <script src="assets/js/custom/crypto-js.min.js"></script>
  <style>
    body {
      font-family: Arial;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 180px;
      margin: 10px 0;
    }

    button {
      padding: 10px 16px;
      margin-right: 10px;
    }

    .row {
      margin-bottom: 12px;
    }
  </style>
</head>
<body>

  <h2>🔐 json Encryption Tool</h2>

  <div class="row">
    <label>Upload .json:</label><br/>
    <input type="file" id="fileInput" accept=".json" />
  </div>

  <div class="row">
    <label>Or paste JSON:</label>
    <textarea id="inputJson" placeholder="Paste your JSON here..."></textarea>
  </div>

  <div class="row">
    <button onclick="encrypt()">Encrypt</button>
    <button onclick="copyOutput()">Copy Output</button>
    <button onclick="downloadFile()">Download enc.json</button>
  </div>

  <h3>Encrypted Output</h3>
  <textarea id="output" placeholder="Encrypted result will appear here..."></textarea>

  <script>
    const KEY = CryptoJS.enc.Utf8.parse('1234567890123456');
    const IV = CryptoJS.enc.Utf8.parse('1234567890123456');

    // Load file content into textarea
    document.getElementById('fileInput').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('inputJson').value = e.target.result;
      };
      reader.readAsText(file);
    });

    function encrypt() {
      try {
        const input = document.getElementById('inputJson').value.trim();

        if (!input) {
          alert('Please upload or paste JSON');
          return;
        }

        // Validate JSON
        JSON.parse(input);

        const encrypted = CryptoJS.AES.encrypt(input, KEY, {
          iv: IV,
          mode: CryptoJS.mode.CBC,
          padding: CryptoJS.pad.Pkcs7
        }).toString();

        const result = {
          data: encrypted
        };

        document.getElementById('output').value = JSON.stringify(result, null, 2);

      } catch (e) {
        alert('Invalid JSON');
      }
    }

    function copyOutput() {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
      alert('Copied to clipboard');
    }

    function downloadFile() {
      const content = document.getElementById('output').value;

      if (!content) {
        alert('Nothing to download. Encrypt first.');
        return;
      }

      const blob = new Blob([content], { type: 'application/json' });
      const url = URL.createObjectURL(blob);

      const a = document.createElement('a');
      a.href = url;
      a.download = 'encrypted.enc.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      URL.revokeObjectURL(url);
    }
  </script>

</body>
</html>
