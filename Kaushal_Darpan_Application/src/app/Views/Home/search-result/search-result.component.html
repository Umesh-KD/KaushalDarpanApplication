<div class="container-fluid p-3 py-5 bg-primary text-white text-center">
  <h3 class="mt-0 text-white">All Campus List</h3>
  
</div>

<div class="container-fluid AboutSection position-relative" style="background: #deebff !important;">
  <img src="/assets/home/img/shape1.png" class="position-absolute shape2 left_image_bounce" />
  <div class="container-xl position-relative" style="z-index:9999">
    <div class="row">

      <div class="col-lg-12 col-md-12 col-sm-12 col-12">
        <div class="card all-post-filer mb-3">
          <div class="card-header">
            <h4>Diploma Result (Semester Scheme)</h4>
          </div>
          <div class="card-body">

            <form class="row g-3 align-items-end">

              <div class="col-md-3">
                <label for="inputState" class="form-label">End Term: </label>
                <select class="form-select mb-0" id="ddlFinancialYearID" [(ngModel)]="searchByFinancialYearID">
                  <option value="">Choose Option</option>
                  <option *ngFor="let item of FinancialYear" [value]="item.FinancialYear">{{item.FinancialYear}}</option>
                </select>
              </div>


              <div class="col-md-3">
                <label for="inputState" class="form-label">Semester: </label>
                <select class="form-select mb-0" id="StreamStreamTypeId" [(ngModel)]="searchBySemester">
                  <option value="">Choose Option</option>
                  <option *ngFor="let item of SemesterList" [value]="item.SemesterID">{{item.SemesterName}}</option>
                </select>
              </div>


              <div class="col-md-3">
                <label for="rollNo" class="form-label">Roll No: </label>
                <input type="text" class="form-control" name="rollNo">
              </div>

              <div class="col-md-3">
                <label for="startDate" class="form-label">Date Of Birth: </label>
                <input type="date"
                       class="form-control"
                       [(ngModel)]="CampusFromDate"
                       name="CampusFromDate"
                       [max]="CampusToDate">
              </div>

              <div class="col-md-3">
                <button type="button" class="btn btn-primary d-flex align-items-center" (click)="GetAllData()">
                  <i class="ti ti-search me-2"></i> Search
                </button>
              </div>

            </form>
          </div>
        </div>
        

        
      </div>
    </div>

  </div>
</div>
