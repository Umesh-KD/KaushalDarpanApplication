<h2>Json Encryption Tool</h2>

<div>
  <label>Upload .json:</label><br>
  <input type="file" (change)="onFileSelected($event)" accept=".json" style="border: solid black 1px; padding: 4px;">
</div>

<br>

<div>
  <label>Or paste JSON:</label>
  <textarea style="border: solid black 1px; width: 100%; padding: 4px; " [(ngModel)]="inputJson" rows="8"></textarea>
</div>

<br>

<button (click)="encrypt()" style="color: green; border: solid black 1px;padding:4px;">Encrypt</button>
<button (click)="copyOutput()" style="color: green; border: solid black 1px; padding: 4px; ">Copy Output</button>
<button (click)="downloadFile()" style="color: green; border: solid black 1px; padding: 4px; ">Download enc.json</button>

<br>
<br>

<h3>Encrypted Output</h3>
<textarea style="border: solid black 1px; width: 100%; padding: 4px; " [value]="outputJson" rows="8"></textarea>
