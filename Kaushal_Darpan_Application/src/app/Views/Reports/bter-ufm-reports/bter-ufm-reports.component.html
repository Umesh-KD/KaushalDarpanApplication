<!-- Page Title Start -->
<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Reports</h4>
    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Bter Results</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Results</a>
    </div>
  </div>
</div>
<!-- Page Title End -->

<div class="card">
  <div class="card-body p-5">
    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light"><b class="text-1xl-5"><i class="ti ti-search"></i> Enter Search Criteria</b></div>
    <!-- Add FormsModule in your module for this to work -->

    <form #form="ngForm" (ngSubmit)="filterFormSubmit()" class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3 mb-8">

      <div>
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">Reports Type <span class="StarMarking">*</span> </label>
        <select class="form-select" [(ngModel)]="filterModel.Action" name="Type" (change)="onTypeChange($event.target.value)">
          <option [value]="0">---Select---</option>
          <option *ngFor="let item of ReportTypelist" [value]="item.URL">{{ item.Name }}</option>
        </select>
      </div>
      <div>
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">Session Year <span class="StarMarking">*</span> </label>
        <select class="form-select" id="ddlFinancialYearID"  name="FinancialYearID" [(ngModel)]="filterModel.FinancialYearID" (ngModelChange)="GetEffectiveFinYear()">
          <option [value]="0">--All--</option>
          <option *ngFor="let item of FinancialYearList" value="{{item.FinancialYearID}}">{{item.FinancialYearName}}</option>
        </select>
      </div>
      <div>
        <label for="selectedSemester" class="text-gray-800 text-sm font-medium inline-block mb-1">Semester <span class="StarMarking">*</span> </label>
        <select class="form-select" [(ngModel)]="filterModel.SemesterID" name="Semester">
          <option [value]="0" selected>--Select--</option>
          <option *ngFor="let item of SemesterMasterList" [value]="item.SemesterID">{{item.SemesterName}}</option>
        </select>
      </div>
      <!--<div>
    <label class="text-gray-800 text-sm font-medium inline-block mb-1">Stream</label>
    <select class="form-select" name="StreamID" [(ngModel)]="filterModel.StreamID">
      <option [value]="0">--Select--</option>
      <option *ngFor="let item of StreamMasterList" [value]="item.StreamID">
        {{item.StreamName}}
      </option>
    </select>
  </div>-->

      <div>
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">EndTerm <span class="StarMarking">*</span> </label>
        <select class="form-select" [(ngModel)]="filterModel.EndTermID" name="EndTermID">
          <option [value]="0">--Select--</option>
          <option *ngFor="let item of endTermFinYear" [value]="item.EndTermID">{{ item.EndTermName }}</option>
        </select>
      </div>

      <!-- Buttons -->

      <div>
        <button type="submit" class="btn bg-info text-white mt-6"> Download</button>
        <button type="button" class="btn bg-danger text-white mt-6" (click)="resetForm()">
          <i class="ti ti-refresh"></i> Reset
        </button>
      </div>

    </form>

  </div>
</div>
