  <!-- Page Title Start -->

<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Annexture 32</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Examination</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Annexture 32</a>

    </div>
  </div>
  <a (click)="Back()" class="inline-flex items-center btn bg-dark text-white btn-sm"><i class="ti ti-chevron-left"></i> Back</a>
</div>



<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <b class="text-1xl-5"><i class="ti ti-plus"></i>Upload Annexture 32</b>
        <a href="javascript:void(0);" class="btn bg-info btn-sm text-white" (click)="GetById()"><i class="ti ti-download"></i>Download Annexture 32</a>
      </div>
      <div class="grid xl:grid-cols-3 lg:grid-cols-3 md:grid-cols-2 gap-6">



        <div></div>

        <div>
    <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
           for="fileStudentPhoto">Upload Annexture 32</label>
    <div class="flex fileUploader">
      <input class="block form-input w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
             id="fileStudentPhoto" type="file" (change)="onFilechange($event,'Photo')">
      <label for="fileStudentPhoto">
        <span>Choose File</span>
        {{request.DisFileName === '' ? 'No File Choosen' : request.DisFileName}}
      </label>
      <div class="flex">
        <a href="{{appsettingConfig.StaticFileRootPathURL + '/' + request.FileName}}"
           *ngIf="this.request.FileName !=''" class="btn bg-primary text-white m-0" target="_blank"><i class="ti ti-eye"></i></a>
        <!--<a href="javascript:void(0);" class="btn bg-danger text-white m-0"
           (click)="DeleteImage(request.FileName,'Photo')" *ngIf="this.request.FileName !=''">
          <i class="ti ti-trash"></i>
        </a>-->
      </div>
    </div>
  </div>

        <div></div>





        <div class="col-span-3 text-center">
          <button type="button" class="btn bg-info text-white mt-6" (click)="SaveData()">Upload</button>
          <button type="button" class="btn bg-danger text-white mt-6" (click)="ResetControls()"><i class="ti ti-refresh"></i> Reset</button>
        </div>

      </div>


    </div>
  </div>

</div>
