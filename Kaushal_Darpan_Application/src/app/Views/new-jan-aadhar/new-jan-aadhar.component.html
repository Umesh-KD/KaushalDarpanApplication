


<div class="card" style="display:none">
  <div class="card-body p-5">

    <!-- Form -->
    <form class="form-container">
      <div class="form-group">
        <label class="form-label" for="janAadharNumber">{{'Enter Jan Aadhaar Number'}}</label>
        <input type="text" class="form-input" id="txtJanadharNo" name="janAadharNumber" maxlength="10"
               [(ngModel)]="request.JAN_AADHAR" placeholder="" required pattern="[0-9]{10,12}" autocomplete="off"
               title="Please enter a valid Jan Aadhaar Number (10 digits)" x (keypress)="numberOnly($event)"
               [disabled]="!isFirstStep" inputmode="numeric" />
      </div>

      <div class="submit-container" >
        <button type="submit" class="btn-primary" id="btnFistStep" (click)="btnFistStep($event)"
                >
          {{'Submit' }}
        </button>
      </div>
    </form>
  </div>
</div>

<ng-template #MemberListPopup let-modal>
  <div class="card">

      <div class="card-header">
        <!-- close icon -->
        <button type="button" class="btn bg-info text-white btn-s pull-right" (click)="closeMemberListPopup()">X</button>
        <h2>Select Jan Aadhaar Member</h2>
      </div>
      <div class="card-body">
        <div id="SecondStep" *ngIf="IsShow">
          <div class="table-list-container mt-0" id="memberListBox">
            <div class="box-heading heading-search mt-0">
             
            </div>
            <div class="table-container">
              <table class="table table-border w-full table-auto">
                <thead>
                  <tr>
                    <th class="text-center">Sr No</th>
                    <th class="text-center">Member Name</th>
                    <th class="text-center">Member ID</th>
                    <th class="text-center">Member Type</th>
                    <th class="text-center"> Select Member</th>
                  </tr>
                </thead>
                <tbody class="text-center">
                  <tr *ngFor="let row of JanAdharMemberList; let i = index">
                    <td>{{i + 1}}</td>
                    <td>{{row.NAME_EN}}</td>
                    <td>{{row.MEMBER_ID}}</td>
                    <td>{{row.MEMBER_TYPE}}</td>
                    <td>
                      <!--;SendOTP(row);-->
                      <!--<button class="btn bg-info text-white btn-sm" (click)="ShowOtpPopup(ApplySchemesEmp);">Send OTP</button>-->
                      <button class="btn bg-info text-white btn-sm" (click)="ShowOtpPopup(ApplySchemesEmp);SendOTP(row);">Send OTP</button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <!--end new jan aadhar code  -->
          </div>
        </div>
      </div>

  </div>
</ng-template>

  <ng-template #ApplySchemesEmp let-modal>
    <div class="otp-overlay">
      <div class="otp-modal">
        <button class="otp-close" type="button" (click)="CloseModalPopup()">
          <i class="fa fa-times"></i>
        </button>

        <!-- Header -->
        <div class="otp-header">
          <div class="otp-icon">
            <i class="fa fa-shield"></i>
          </div>
          <h4>OTP Verification</h4>
          <p class="sub">Verify Jan Aadhaar</p>
        </div>

        <!-- Body -->
        <div class="otp-body">
          <p class="text-center info-text">
            We have sent a <b>6-digit OTP</b> to your registered mobile number
          </p>
     
          <div class="otp-box-wrapper">
            <input class="otp-digit"
                   maxlength="1"
                   *ngFor="let item of otpArray; let i = index"
                   #otpInput
                   type="text"
                   inputmode="numeric"
                   pattern="[0-9]*"
                   (input)="onOtpInput($event, i)"
                   (keydown)="onKeyDown($event, i)"
                   (paste)="onPaste($event)">

          </div>
        </div>

        <!-- Footer -->
        <div class="otp-footer" style="margin-top:25px;">
          <button class="verify-btn" type="button" (click)="VerifyOTP()">
            <i class="fa fa-check-circle"></i> Verify OTP
          </button>
          <button *ngIf="showResendButton" class="close-btn" type="button" id="resendBtn"
                  (click)="ResendOTP()">
            <i class="fa fa-refresh"></i> Re-Send OTP
          </button>
          <div class="re-timer mt-2 text-center" *ngIf="!showResendButton && isOpen">
            <p class="m-0" id="timers">Resend in <span class="text-danger">{{ formatTime(timeLeft) }} seconds</span></p>
          </div>
        </div>

      </div>
    </div>
  </ng-template>
