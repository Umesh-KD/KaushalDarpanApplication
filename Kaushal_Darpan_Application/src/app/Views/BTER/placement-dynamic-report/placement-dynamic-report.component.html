<!-- Page Title Start -->

<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2"> Placement Dynamic Report </h4>
    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Report</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Placement Dynamic Report</a>
    </div>
  </div>
</div>
<!-- Page Title End -->

<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <b class="text-1xl-5"><i class="ti ti-search"></i> Enter Search Criteria</b>
      </div>
      <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">
        <div>
           <!-- (change)="onActionTypeChange($event)" -->
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Report Type</label>
          <select class="form-select" id="ActionType" [(ngModel)]="ActionType">
            <option value="">--Select--</option>
            <option *ngFor="let item of PlacementDynamicData_ddl" value="{{item.Name}}">{{item.Name}}</option>
          </select>
        </div>
        
        <div *ngIf="ActionType == 'Shortlist-Student-Report' || ActionType == 'Placed-Student-Report'">
           <!-- (change)="GetCampusWiseHiringRoleDDL()" -->
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">Campus</label>
            <ng-select [(ngModel)]="CampusPostID"                       
                       [clearable]="false">                   
              <ng-option [value]="0" selected>--Select--</ng-option>
              <ng-container *ngFor="let item of CampusMasterList;">
                <ng-option [value]="item.ID">{{item.Name}}</ng-option>
              </ng-container>
            </ng-select>
        </div>
        <!-- <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">
            From Date: <span class="StarMarking">*</span>
          </label>
          <input type="date" class="form-input" (input)="GetAllData()" [(ngModel)]="FromDate">
        </div>

        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">
            To Date: <span class="StarMarking">*</span>
          </label>
          <input type="date" class="form-input" (input)="GetAllData()" [(ngModel)]="ToDate" [min]="FromDate">
        </div> -->


        <div>
          <button type="button" class="btn bg-info text-white mt-6" (click)="GetAllData()">Search</button>
          <button type="button" class="btn bg-danger text-white mt-6" (click)="ClearSearchData()">
            <i class="ti ti-refresh"></i>
            Reset
          </button>
        </div>
      </div>
    </div>
