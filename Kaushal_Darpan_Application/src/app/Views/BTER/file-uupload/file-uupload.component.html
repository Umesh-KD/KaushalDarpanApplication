<!-- Page Title Start -->
<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Upload File</h4>
  </div>
</div>
<!-- Page Title End -->

<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-center">
        <div class="flex fileUploader">
          <input class="block form-input w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
                 id="fileupload" type="file" (change)="onFilechange($event)" />
          <label for="fileupload">
            <span>Choose File</span>
          </label>
        </div>
        <button type="button" class="btn bg-info text-white mt-6" (click)="UploadFile()">Upload</button>
      </div>
    </div>
  </div>
</div>
