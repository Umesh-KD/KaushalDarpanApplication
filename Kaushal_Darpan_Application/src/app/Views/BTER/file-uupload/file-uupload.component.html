<!-- Page Title Start -->
<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">File Master</h4>
  </div>
</div>
<!-- Page Title End -->

<div class="card">
  <div class="card-body p-5">

    <div class="mb-4">
      <!-- file upload -->
      <div *ngIf="ForDelete==false">
        <label style="color:red;">Note: folder create inside 'StaticFiles' root folder. if not pass then root folder itself.</label>
        <br />
        <br />
        <span>Folder Name : </span><input type="text" name="FolderName" [(ngModel)]="uploadFileModel.FolderName" class="block form-input" style="width:50em;" />
        <br />
        <span>For Page Management : </span><input type="checkbox" name="ForPGMK" [(ngModel)]="uploadFileModel.ForPGMK" class="block form-input" style="width:10px;" />
        <br />
        <div class="flex">
          <input class="block form-input" style="width:50em;"
                 id="fileupload" type="file" #fileupload />
          <button type="button" class="btn bg-info text-white mt-6" (click)="UploadFile(fileupload)">Upload File</button>
        </div>
      </div>

      <!-- file delete -->
      <div *ngIf="ForDelete==true">
        <label style="color:red;">Note: file delete inside 'StaticFiles' root folder. if not pass then root folder file itself.</label>
        <br />
        <br />
        <span>Folder Name : </span><input type="text" name="FolderName" [(ngModel)]="deleteFileModel.FolderName" class="block form-input" style="width:50em;" />
        <br />
        <span>File Name : </span><input type="text" name="FileName" [(ngModel)]="deleteFileModel.FileName" class="block form-input" style="width:50em;" />
        <br />
        <span>For Page Management : </span><input type="checkbox" name="ForPGMK" [(ngModel)]="deleteFileModel.ForPGMK" class="block form-input" style="width:10px;" />
        <br />
        <button type="button" class="btn bg-info text-white mt-6" (click)="DeleteFile(fileupload)">Delete File</button>
      </div>
    </div>

  </div>
</div>
