<!-- Page Title Start -->
<app-loader></app-loader>
<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Inventory Dashboard Report</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <!--<a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Dashboard</a>-->
      <a [routerLink]="['/InventoryDashboard']"
         class="text-sm font-medium text-slate-700 cursor-pointer">
        Dashboard
      </a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Branch Equipments Mapping</a>
    </div>
  </div>
</div>
<!-- Page Title End -->
<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <b class="text-1xl-5"><i class="ti ti-search"></i> Enter Search Criteria</b>

      </div>

      <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">

        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">
            Search By Category: <span class="StarMarking">*</span>
          </label>
          <select class="form-select" id="CategoryId" [(ngModel)]="Searchrequest.CategoryId">
            <option value="0">Choose Option</option>
            <option *ngFor="let item of CategoryDDLList" [value]="item.ItemCategoryID">{{item.Name}}</option>
          </select>
        </div>

        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">
            Search By Equipment: <span class="StarMarking">*</span>
          </label>
          <select class="form-select" id="EquipmentId" [(ngModel)]="Searchrequest.EquipmentId">
            <option value="0">Choose Option</option>
            <option *ngFor="let item of EquipmentsDDLList" [value]="item.EquipmentsId">{{item.Name}}</option>
          </select>
        </div>

        <div>
          <button type="button" class="btn bg-info text-white mt-6" (click)="LoadDynamicReport()">Search</button>
          <button type="button" class="btn bg-danger text-white mt-6" (click)="ResetControl()"><i class="ti ti-refresh"></i>Reset</button>
        </div>
      </div>


    </div>
    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5"><i class="ti ti-list"></i> Search Results</b>
      <a href="javascript:void(0);" (click)="exportToExcel()" class="btn bg-info btn-sm text-white" *ngIf="MappingList && MappingList.length > 0">
        <i class="ti ti-download"></i> Download Execel
      </a>
      <a href="javascript:void(0);" class="btn bg-success btn-sm text-white"
         (click)="exportToPDF()">
        <i class="ti ti-download"></i> Download PDF
      </a>
    
    </div>
    <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">
      <div class="">
        <select id="ddlConter" class="form-select  couterDropDown">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="">
      </div>
      <div class="">
      </div>
      <div class="">
        <input class="form-input" placeholder="Search....." [(ngModel)]="Table_SearchText" />
      </div>
    </div>
    <div class="overflow-x-auto mt-4"
         *ngIf="MappingList && MappingList.length > 0">

      <table class="table table-border w-full table-auto">

        <thead>
          <tr>
            <th *ngFor="let col of DynamicColumns">
              {{ col }}
            </th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of MappingList | tableSearchFilter:Table_SearchText;let idx=index;">

            <td *ngFor="let col of DynamicColumns">
              {{ row[col] }}
            </td>

          </tr>
        </tbody>

      </table>

    </div>

  </div>
</div>

<!-- end row -->
<ng-template #MyModel_ReplayQuery let-modal>
  <div class="modal-content">
    <div class="card">
      <div class="card-header flex justify-between items-center">
        <b class="text-1xl-5">Action <small class="text-danger">(* fields are mandatory)</small></b>
        <button class="btn bg-info text-white" (click)="CloseModal()" type="button"><i class="ti ti-x"></i></button>
      </div>
      <div class="card-body">

        <div class="grid 2xl:grid-cols-1 xl:grid-cols-1 lg:grid-cols-1 md:grid-cols-1 grid-cols-1 gap-3">


          <div>
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">
              Remark <span class="StarMarking">*</span>
            </label>
            <textarea class="form-input" [(ngModel)]="Revertrequest.Remark"></textarea>
            <!--<div *ngIf="isSubmitted && groupForm.controls.txtRemark.errors" class="text-danger">
              <p *ngIf="groupForm.controls.txtRemark.errors.required"><i aria-hidden="true"></i>This field is required .!</p>
            </div>-->
          </div>
        </div>
      </div> <!-- Close this div here for card-body -->
      <div class="card-footer text-right">
        <button type="button" (click)="RevertStausUpdate()" class="btn bg-success text-white btn-sm">
          Submit
        </button>
      </div>

    </div>
  </div>
</ng-template>
