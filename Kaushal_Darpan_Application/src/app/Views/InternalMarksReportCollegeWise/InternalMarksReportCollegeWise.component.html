<!-- Page Title Start -->

<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Eligible Student </h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Eligible Student</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Eligible Student List</a>
    </div>
  </div>
</div>
<!-- Page Title End -->


<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <b class="text-1xl-5"><i class="ti ti-search"></i> Enter Search Criteria</b>
        <!-- <a [routerLink]="'/AddCompany'"  [queryParams]="{key:1}" class="btn bg-success btn-sm text-white"><i class="ti ti-plus"></i>Add New</a> -->
      </div>
      <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">

        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Institute</label>
          <select class="form-select" id="InstituteID" [(ngModel)]="searchRequest.InstituteID">
            <option value="0">--All--</option>
            <option *ngFor="let item of InstituteMasterDDLList" [value]="item.InstituteID">{{item.InstituteName}}</option>
          </select>
        </div>
        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Branch<span class="StarMarking">*</span></label>
          <select class="form-select" id="StreamID" [(ngModel)]="searchRequest.StreamID">
            <option value="0">--Select--</option>
            <option *ngFor="let item of BranchList" [value]="item.StreamID">{{item.Name}}</option>
          </select>
        </div>

        <!-- value="{{searchRequest.SemesterID}}" -->
        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1"> Year/Semester</label>
          <select class="form-select" id="StudentExamYear"
                  [(ngModel)]="searchRequest.SemesterID">
            <option value="0">--All--</option>
            <option *ngFor="let item of SemesterMasterList" [value]="item.SemesterID">{{item.SemesterName}}</option>
          </select>
        </div>

        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Scheme</label>
          <select class="form-select" id="SchemeID" [(ngModel)]="searchRequest.SchemeID">
            <option value="0">--All--</option>
            <!-- <option value="1346"> Yearly Scheme</option> -->
            <option value="1347">Old Semester Scheme</option>
            <option value="1348">New Semester Scheme</option>
            <!-- <option value="1349">Merged Semester Scheme</option> -->
          </select>
        </div>

        <div>
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Type</label>
          <select class="form-select" id="TypeID" [(ngModel)]="searchRequest.TypeID">
            <option value="0">--All--</option>
            <option value="1">Practical</option>
            <option value="2">Internal Assessment </option>
            <option value="3">SCA</option>
          </select>
        </div>

        <div>
          <button type="button" class="btn bg-info text-white mt-6" (click)="GetEligibleStudentListData(1)">Search</button>
          <button type="button" class="btn bg-danger text-white mt-6" (click)="ClearSearchData()">
            
            <i class="ti ti-refresh"></i>
            Reset
          </button>
        </div>

      </div>
    </div>

    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5"><i class="ti ti-list"></i> List</b>
      <div class="flex justify-between items-center gap-3">

        <!--<input class="form-input" placeholder="Search..." [(ngModel)]="Table_SearchText" />-->
        <a href="javascript:void(0)" (click)="downloadIAStudentReport()" class="btn bg-info btn-sm text-white me-2"><i class="ti ti-download"></i> Download IA Student Report</a>

      </div>
    </div>



  </div>
</div>
<!-- end row -->
