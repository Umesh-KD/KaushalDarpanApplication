<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ITI Master Dashboard</title>

  <!-- Bootstrap 5 -->
  <!--<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css" rel="stylesheet">-->
  <!-- Bootstrap Icons -->



  <style>
    body {
      background-color: #f4f6f9;
      font-family: "Segoe UI", sans-serif;
    }

    .dashboard-header {
      font-size: 22px;
      font-weight: 600;
      color: #2c3e50;
    }

    /* Tile Card */
    .stat-card {
      border: none;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.08);
    }

    .stat-title {
      font-size: 14px;
      color: #6c757d;
    }

    .stat-value {
      font-size: 26px;
      font-weight: 600;
      margin-top: 3px;
    }

    .stat-icon {
      font-size: 35px;
      padding: 12px;
      border-radius: 50%;
    }

    /* Light Colors */
    .bg-light-blue {
      background: #e8f1ff;
    }

    .bg-light-green {
      background: #eafaf1;
    }

    .bg-light-yellow {
      background: #fff8e6;
    }

    .bg-light-purple {
      background: #f3e8ff;
    }

    .bg-light-gray {
      background: #f1f3f5;
    }

    /* Chart Card */
    .chart-card {
      border: none;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0px 2px 6px rgba(0,0,0,0.08);
      padding: 20px;
    }
  </style>
</head>

<body>

  <div>

    <!-- Header -->
    <div class="mb-4">
      <h2 class="dashboard-header"><i class="fa fa-dashboard"></i> Master Dashboard</h2>
    </div>
    <!-- ================= Trade Dashboard ================= -->
    <div class="mt-4 flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light w-full pointer-event ng-star-inserted">
      <h3>
        <b>
          <i class="fa fa-list">  </i>
          Trade Dashboard

        </b>
      </h3>
    </div>

    <div class="grid 2xl:grid-cols-2 xl:grid-cols-2 lg:grid-cols-4 md:grid-cols-2 gap-6 mb-6 allStatics">
      <div class="col-lg-3">
        <div class="">
          <div class="p-2">
            <div class="stat-card bg-light-blue">
              <div>
                <div class="stat-title">Engineering Trades</div>
                <div class="stat-value text-primary">120</div>
              </div>
              <div class="stat-icon text-primary bg-white">
                <i class="bi bi-gear-fill"></i>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-lg-3">
        <div class="">
          <div class="p-2">
            <div class="stat-card bg-light-green">
              <div>
                <div class="stat-title">Non-Engineering Trades</div>
                <div class="stat-value text-success">80</div>
              </div>
              <div class="stat-icon text-success bg-white">
                <i class="bi bi-book-fill"></i>
              </div>
            </div>
          </div>
        </div>
      </div>


    </div>


    <!-- Trade Chart -->
    <div class="chart-card mt-4">
      <h6 class="mb-3 text-muted">Trade Distribution</h6>
      <canvas id="tradeChart" height="110"></canvas>
    </div>


    <!-- ================= College Dashboard ================= -->
    <div class="mt-4 flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light w-full pointer-event ng-star-inserted">

      <h3>
        <b>
          <i class="fa fa-list"></i> College Master Dashboard

        </b>
      </h3>

    </div>

    <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-4 md:grid-cols-2 gap-6 mb-6 allStatics">

      <!-- Govt Colleges -->
      <div class="col-md-3">
        <div class="stat-card bg-light-yellow">
          <div>
            <div class="stat-title">Govt Colleges</div>
            <div class="stat-value text-warning">45</div>
          </div>
          <div class="stat-icon text-warning bg-white">
            <i class="bi bi-bank2"></i>
          </div>
        </div>
      </div>






      <!-- Private Colleges -->
      <div class="col-md-3">
        <div class="stat-card bg-light-purple">
          <div>
            <div class="stat-title">Private Colleges</div>
            <div class="stat-value text-danger">95</div>
          </div>
          <div class="stat-icon text-danger bg-white">
            <i class="bi bi-building"></i>
          </div>
        </div>
      </div>

      <!-- Co-Ed Colleges -->
      <div class="col-md-3">
        <div class="stat-card bg-light-blue">
          <div>
            <div class="stat-title">Co-Ed Colleges</div>
            <div class="stat-value text-primary">110</div>
          </div>
          <div class="stat-icon text-primary bg-white">
            <i class="bi bi-people-fill"></i>
          </div>
        </div>
      </div>

      <!-- Boys Colleges -->
      <div class="col-md-3">
        <div class="stat-card bg-light-gray">
          <div>
            <div class="stat-title">Boys Colleges</div>
            <div class="stat-value text-dark">30</div>
          </div>
          <div class="stat-icon text-dark bg-white">
            <i class="bi bi-person-fill"></i>
          </div>
        </div>
      </div>

    </div>

    <!-- College Chart -->
    <div class="chart-card mt-4">
      <h6 class="mb-3 text-muted">College Category Overview</h6>
      <canvas id="collegeChart" height="110"></canvas>
    </div>

  </div>







  <!-- ================= Chart Scripts ================= -->
  <script>
    // Trade Doughnut Chart
    new Chart(document.getElementById("tradeChart"), {
      type: "doughnut",
      data: {
        labels: ["Engineering", "Non-Engineering"],
        datasets: [{
          data: [120, 80],
          backgroundColor: ["#0d6efd", "#198754"]
        }]
      },
      options: {
        plugins: {
          legend: { position: "bottom" }
        }
      }
    });

    // College Bar Chart
    new Chart(document.getElementById("collegeChart"), {
      type: "bar",
      data: {
        labels: ["Govt", "Private", "Co-Ed", "Boys"],
        datasets: [{
          label: "Total Colleges",
          data: [45, 95, 110, 30],
          backgroundColor: "#0d6efd"
        }]
      },
      options: {
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { beginAtZero: true }
        }
      }
    });
  </script>

</body>
</html>
