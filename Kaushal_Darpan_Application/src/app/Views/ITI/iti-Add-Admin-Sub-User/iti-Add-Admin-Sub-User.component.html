<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Add user</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a class="text-sm font-medium text-slate-700">Dashboard</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a class="text-sm font-medium text-slate-700" aria-current="page">Add user</a>
    </div>
  </div>
</div>


<div class="card">
  
  <form [formGroup]="AdminUserFormGroup" id="AdminUserFormGroup" class="form-horizontal">
    <div class="card">
      <div class="card-body p-5">
        <div class="mb-8">
          <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
            <b class="text-1xl-5"><i class="ti ti-plus"></i> {{ IsView ? 'Update ITI Admin User' : 'Add New ITI Admin User' }}</b>
            <a routerLink="/Admin-Sub-User" class="btn bg-info btn-sm text-white me-2">
              <i class="ti ti-chevron-left"></i>Back
            </a>
          </div>
          <div class="grid 2xl:grid-cols-3 xl:grid-cols-3 lg:grid-cols-2 md:grid-cols-2 grid-cols-1 gap-3">

            <div>

              <label for="txtSSOID" class="text-gray-800 text-sm font-medium inline-block mb-2">
                SSO ID<span class="StarMarking">*</span>
              </label>
              <div class="flex">
                <input type="text" class="form-input" id="txtSSOID" placeholder="Enter SSOID" name="txtSSOID" formControlName="txtSSOID"
                       [(ngModel)]="adminRequest.SSOID">

                <button type="button" class="btn bg-info text-white" (click)="SSOIDGetSomeDetails(adminRequest.SSOID)">GetDetails</button>
              </div>

              <div *ngIf="isSubmitted&&_AdminUserFormGroup.txtSSOID.errors" class="text-danger">
                <p *ngIf="_AdminUserFormGroup.txtSSOID.errors.required">
                  <i aria-hidden="true"></i> This field is
                  required .!
                </p>
                <p *ngIf="_AdminUserFormGroup.txtSSOID.errors.pattern">
                  <i aria-hidden="true"></i> Please Enter valid SSSOID .!
                </p>
              </div>
            </div>
            <div>
              <label for="txtUserName" class="text-gray-800 text-sm font-medium inline-block mb-2">
                Name<span class="StarMarking">*</span>
              </label>
              <input type="text" class="form-input" id="txtUserName" placeholder="Name" name="txtUserName" formControlName="txtUserName"
                     [(ngModel)]="adminRequest.Name">
              <div *ngIf="isSubmitted && _AdminUserFormGroup.txtUserName.errors" class="text-danger">
                <p *ngIf="_AdminUserFormGroup.txtUserName.errors.required">
                  <i aria-hidden="true"></i> This field is
                  required.!
                </p>
              </div>
            </div>

            <div>
              <label for="txtMobileNo" class="text-gray-800 text-sm font-medium inline-block mb-2">
                Mobile No<span class="StarMarking">*</span>
              </label>
              <input type="text" class="form-input" id="txtMobileNo" placeholder="Mobile Number" name="txtMobileNo" formControlName="txtMobileNo"
                     [(ngModel)]="adminRequest.MobileNo" maxlength="10">
              <div *ngIf="isSubmitted&&_AdminUserFormGroup.txtMobileNo.errors" class="text-danger">
                <p *ngIf="_AdminUserFormGroup.txtMobileNo.errors.required">
                  <i aria-hidden="true"></i> This field is
                  required .!
                </p>
              </div>
            </div>



            <div>
              <label for="txtUserEmail" class="text-gray-800 text-sm font-medium inline-block mb-2">
                User Email<span class="StarMarking">*</span>
              </label>
              <input type="email" class="form-input" id="txtUserEmail" placeholder="User Email" name="txtUserEmail"
                     formControlName="txtUserEmail" [(ngModel)]="adminRequest.Email">
              <div *ngIf="isSubmitted&&_AdminUserFormGroup.txtUserEmail.errors" class="text-danger">
                <p *ngIf="_AdminUserFormGroup.txtUserEmail.errors.required">
                  <i aria-hidden="true"></i> This field is
                  required .!
                </p>
              </div>
            </div>

            <div class="">
              <label for="txtUserEmail" class="text-gray-800 text-sm font-medium inline-block mb-2">
                Role<span class="StarMarking">*</span>
              </label>
              <select id="ddlConter" class="form-select" [(ngModel)]="adminRequest.RoleID" formControlName="RoleID">
                <option value="0">--Select--</option>
                <option value="253">Exam Incharge SCVT</option>
                <option value="254">Exam Incharge NCVT</option>
                <option value="255">Admission Incharge</option>
              </select>
            </div>




          </div>
          <div class="grid 2xl:grid-cols-1 xl:grid-cols-1 lg:grid-cols-1 md:grid-cols-1 grid-cols-1 gap-3">
            <div class="text-center">
              <button type="button" class="btn bg-info text-white mt-6" id="btnSave" (click)="SaveData()">{{ IsView ? 'Update' : 'Submit' }}</button>
              <button type="button" class="btn bg-danger text-white mt-6" id="btnReset" (click)="ResetControls()">
                <i class="ti ti-refresh"></i> Reset
              </button>
            </div>

          </div>


        </div>
      </div>

    </div>
  </form>
</div>
