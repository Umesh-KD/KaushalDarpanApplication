<div class="card">
  <div class="card-body p-5">

    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5">
        <i class="ti ti-settings"></i>
        Visibility Configuration
      </b>
    </div>

    <div class="overflow-x-auto mt-3">
      <table class="table table-border w-full table-auto">
        <thead class="bg-light/40">
          <tr>
            <th style="text-align:left;" width="80">Sr. No.</th>
            <th style="text-align:left;">End Term Name</th>
            <th style="text-align:left;">Configuration Name</th>
            <th style="text-align:left;" width="150">Status</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let row of visibilitySettings; let i=index">
            <td>{{i+1}}</td>

            <td>
              {{row.EndTermName}}
            </td>
            <td>
              {{row.SettingName}}
            </td>


            <td>
              <label class="inline-flex items-center cursor-pointer toggleCheckBox">
                <input class="sr-only peer"
                       type="checkbox"
                       [checked]="row.SettingValue == 1"
                       (change)="onToggleChange($event,row)">

                <span class="toggleIcon"></span>
              </label>
            </td>
          </tr>
        </tbody>

        <tfoot>
          <tr *ngIf="visibilitySettings.length==0">
            <td colspan="3" align="center">
              <img src="../../../assets/images/no_record_found_1.png" width="180" />
            </td>
          </tr>
        </tfoot>
      </table>
    </div>

  </div>
</div>
