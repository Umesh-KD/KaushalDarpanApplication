<div class="card">
  <div class="card-body p-5">
    <div class="row my-3">
      <div class="col-md-4">
        <label class="form-label">SSOID:</label>
        <input type="text" class="form-control" id="txtMobileNumber" placeholder="Enter SSOID/UID" [(ngModel)]="SSOID">
      </div>
      <div class="col-md-4">
        <div class="mt-4 d-flex align-items-center">
          <button type="button" class="btn bg-info text-white" (click)="openModalGenerateOTP()">Send OTP</button>
          <!--<span class="d-block mx-1">OR</span><a class="btn bg-info text-white" href="https://sso.rajasthan.gov.in/signin?ru=hte"> Apply BY SSO</a>-->
        </div>
        <!--<button type="button" id="btnReset" (click)="ResetControl()" class="btn bg-danger text-white"><i class="ti ti-refresh"></i> Reset</button>-->
      </div>
    </div>


    <div  class="overflow-x-auto mt-3" *ngIf="ApplicationList.length>0 && !showpage">


      <table class="table table-border w-full table-auto" cellpadding="10">
        <thead class="bg-light/40 border-b border-gray-100 dark:bg-light/5 dark:border-b-gray-700 h-10">
          <tr class="border border-gray-300">
            <th class="text-left">Name</th>
            <th class="text-left">DOB</th>
            <th class="text-left">Gender</th>

            <th class="text-left">Mobile</th>
            <th class="text-left">Email</th>
            <th class="text-left">Status</th>
            <th class="border border-gray-300 px-2 py-1">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of ApplicationList; let i = index" >
            <td>{{app.Name}}</td>
            <td >{{app.Dob}}</td>
            <td >{{app.Gender}}</td>
            <td >{{app.Mobile}}</td>
            <td >{{app.Email}}</td>
            <td>{{app.StatusName}}</td>
            <td  >
              <div>

                <a (click)="onViewApp(app.Uid)" class="btn btn-primary btn-sm me-2">View</a>
                <a *ngIf="app.StatusID==3 " (click)="onViewDetail(app.Uid)" class="btn btn-success btn-sm">Correct Details</a>
                <a *ngIf="app.StatusID==2" (click)="onViewOption(app.ID)" class=" btn btn-success btn-sm">Add Choice</a>
                <a *ngIf="app.StatusID==6" (click)="onViewSelect(app.ID)" class=" btn btn-success btn-sm">Join Iti</a>
              </div>
                </td>
          </tr>
        </tbody>
      </table>
    </div>






    <app-iti-instructor *ngIf="showpage"  [uid]="selectedUid" (formSaved)="onOptionSaved($event)" ></app-iti-instructor>
    <app-iti-instructor-view *ngIf="showView" [uid]="selectedUid" (formSaved)="onOptionSaved($event)"></app-iti-instructor-view>
    <app-instructor-selectchoice *ngIf="showselect" [uid]="selectedUid" (formSaved)="onOptionSaved($event)"></app-instructor-selectchoice>
    <app-instructor-option-form *ngIf="showOption" [uid]="selectedUid"  (formSaved)="onOptionSaved($event)"></app-instructor-option-form>

      <app-otpmodal #otpModal></app-otpmodal>
