<!-- Page Title Start -->

<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Sanction Order List</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Dashboard</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a class="text-sm font-medium text-slate-700" aria-current="page">Sanction Order List</a>
    </div>
  </div>
</div>
<!-- Page Title End -->

<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <b class="text-1xl-5"><i class="ti ti-search"></i> Enter Search Criteria</b>
        <div  class="flex justify-end flex-wrap items-center">
          <a *ngIf="sSOLoginDataModel.RoleID==_enumrole.ITIPlanningAdmin || sSOLoginDataModel.RoleID== _enumrole.ITIBuildingAdmin || sSOLoginDataModel.RoleID==_enumrole.DTE_TrainingT2_establishment " routerLink="/AddSanctionOrder" class="btn bg-info btn-sm text-white me-2">
            <i class="ti ti-plus"></i>Add
          </a>
          <!--<a routerLink="/ChangeExaminer" class="btn bg-info btn-sm text-white">
            <i class="ti ti-refresh"></i>Change Examiner
          </a>-->
        </div>
      </div>
      <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">

        <!--<div>
    <label class="text-gray-800 text-sm font-medium inline-block mb-1">Exam Name</label>
    <select class="form-select" id="SemesterID" [(ngModel)]="searchRequest.ExamID">
      <option value="0">Choose Option</option>
      <option *ngFor="let item of ExamList" [value]="item.ID">
        {{item.Name}}
      </option>
    </select>
  </div>-->
        <!--semester-->


        <div *ngIf="sSOLoginDataModel.RoleID!=_enumrole.DTE_TrainingT2_establishment">
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Sanction Type:</label>
          <select class="form-select" id="CollegeID" [(ngModel)]="searchRequest.ParentID">

            <option value="0">--All--</option>
            <option value="1">Administrative Sanction</option>
            <option value="2">Financial Sanction</option>
            <option value="3">Post Sanction</option>

          </select>

        </div>


        <div *ngIf="sSOLoginDataModel.RoleID==_enumrole.DTE_TrainingT2_establishment">
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">Sanction Type:</label>
          <select class="form-select" id="CollegeID" [(ngModel)]="searchRequest.ParentID">

            <option value="0">--All--</option>

            <option value="4">Transfer Sanction</option>
          </select>

        </div>


        <!--<div>
    <label class="text-gray-800 text-sm font-medium inline-block mb-1">Semester Name</label>
    <select class="form-select" id="SemesterID" [(ngModel)]="searchRequest.SemesterID">
      <option value="0">--All--</option>
      <option *ngFor="let item of SemesterMasterDDLList" [value]="item.SemesterID">
        {{item.SemesterName}}
      </option>
    </select>
  </div>-->
        <!--commonsubject(yes/no)-->
        <!--branch-->
        <!--<div>
    <label class="text-gray-800 text-sm font-medium inline-block mb-1">Branch Name</label>
    <select class="form-select" id="StreamID" [(ngModel)]="searchRequest.StreamID">
      <option value="0">--All--</option>
      <option *ngFor="let item of StreamMasterDDLList" [value]="item.StreamID">
        {{item.StreamName}}
      </option>
    </select>
  </div>-->
        <!--subject-->
        <!--group code-->



        <div>
          <button type="button" class="btn bg-info text-white mt-6" (click)="getExaminerData()">Search</button>
          <button type="button" class="btn bg-danger text-white mt-6" (click)="ResetControl()">Cancel</button>
        </div>
      </div>

    </div>
    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5"><i class="ti ti-list"></i> Search Results</b>
    </div>
    <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">
      <div class="">
        <!--<select id="ddlConter" class="form-select  couterDropDown">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>-->
      </div>
      <div class="">
      </div>
      <div class="">
      </div>
      <div class="">
        <input class="form-input" placeholder="Search..." [(ngModel)]="Table_SearchText" />
      </div>
    </div>
    <div class="overflow-x-auto mt-3">
      <table class="table table-border w-full table-auto" cellpadding="5">
        <thead class="bg-light/40 border-b border-gray-100 dark:bg-light/5 dark:border-b-gray-700 h-10">
          <tr>
            <th>S.No</th>
            <th>Sanction Type</th>
            <th>Sub-Type</th>
            <th>Order No</th>
            <th>Order Date</th>
      
            <th class="text-center">Action</th>

          </tr>

        </thead>
        <tbody>
          <tr *ngFor="let row of ExaminersList | tableSearchFilter:Table_SearchText;let idx=index;">
            <td class="text-center">{{idx+1}}</td>
            <td class="text-center">{{row.ParentName}}</td>
            <td class="text-center">{{row.OrderTypeName}}</td>
            <td class="text-center">{{row.OrderNo}}</td>
            <td class="text-center">{{row.OrderDate}}</td>
          
            <td>
              <div  class="flex align-center justify-center actionBtns w-auto"
                   style="width:auto !important">
                <a *ngIf="sSOLoginDataModel.RoleID==_enumrole.ITIPlanningAdmin || sSOLoginDataModel.RoleID==_enumrole.DTE_TrainingT2_establishment || sSOLoginDataModel.RoleID== _enumrole.ITIBuildingAdmin " [routerLink]="'/AddSanctionOrder'" [queryParams]="{SanctionID:row.SanctionID}" href="javascript:void(0);" title="edit"><i class="ti ti-pencil"></i></a>
                <a  *ngIf="(row.Eid==0 || row.Eid==null) && (sSOLoginDataModel.RoleID==_enumrole.ITIPlanningAdmin || sSOLoginDataModel.RoleID== _enumrole.ITIBuildingAdmin || sSOLoginDataModel.RoleID==_enumrole.DTE_TrainingT2_establishment )  " href="javascript:void(0);" title="Remove"
                   (click)="btnDelete_OnClick(row.SanctionID)"><i class="ti ti-trash"></i></a>
                <div *ngIf="row.OrderCopy" class="flex align-center justify-center actionBtns w-auto" style="width:auto !important">
                  <a download target="_blank" href="{{appsettingConfig.StaticFileRootPathURL}}/{{row.OrderCopy}}" title="Download"><i class="ti ti-download"></i></a>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

    </div>

  </div>
</div>
