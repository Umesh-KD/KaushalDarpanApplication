<div class="">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h2 class="dashboard-title mb-0">Dashboard</h2>
      <small class="text-muted">DTE - T2</small>
    </div>
  </div>
  <div class="grid grid-cols-1 lg:grid-cols-3 md:grid-cols-3 gap-5">
    <div class=" " *ngFor="let row of dashboardData?.Establishment; let i = index">
      <div class="card top-card" [ngClass]="row.bgClass">
        <div class="card-body flex justify-between items-center">
          <div class="flex gap-3 items-center">
            <div class="icon-box bg-white" [ngClass]="row.bgClassIcon">
              <i [ngClass]="row.SRC"></i>
            </div>
            <div>
              <div>
                <p>{{row.TotalText}}</p>
              </div>
              <div class="big-count blue fs-1">
                <a [routerLink]="['/',row.URL]" [queryParams]="{act: row.Action }" >
                  <h2 class="big-count fs-1" [ngClass]="row.countTextColor">{{row.TotalCount}}</h2>
                </a>
              </div>
            </div>
          </div>
          <i [ngClass]="row.bottomIcon"></i>
        </div>
      </div>
    </div>
  </div>

  <div class="grid grid-cols-1 2xl:grid-cols-6 xl:grid-cols-6 lg:grid-cols-4 md:grid-cols-3 gap-5 mt-5 mb-5">

    <div class=" " *ngFor="let row of dashboardData?.RelievingJoining; let i = index">
      <div class="card mini-card">
        <div class="card-body h-100">
          <div class=" ">
            <div><i [ngClass]="[row.SRC, row.bgClassIcon]"></i></div>
            <div>{{row.TotalText}}</div>
            <a [routerLink]="['/',row.URL]" [queryParams]="{act: row.Action }" >
              <div class="count mt-2" [ngClass]="row.countTextColor">{{row.TotalCount}}</div>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card summary-card">
    <div class="card-body p-4">

      <h4 class="mb-4">Category Wise Staff Count</h4>

      <div class="grid grid-cols-1 lg:grid-cols-3 md:grid-cols-3 gap-5">

          <div class="transfer-chart-wrap">

            <highcharts-chart *ngIf="PostTypeStaffChartOptions"
                              [Highcharts]="Highcharts"
                              [options]="PostTypeStaffChartOptions"
                              style="width:420px;height:420px;display:block;">
            </highcharts-chart>

          </div>

        <div class=" mt-6">

          <div class="flex justify-between mb-3" *ngFor="let item of dashboardData?.PostTypeStaff; let i = index">
            <div>
              <span [class]="item.bgClassIcon"></span>
              {{item.TotalText}}
            </div>
            <strong>{{item.TotalCount}}</strong>
            <span class="text-muted">{{PostTypeStaffPercentage(item.TotalCount)}}</span>
          </div>
        </div>

        <div class=" ">
          <div class="total-staff-box">
            <i class="bi bi-people-fill"></i>
            <h4 class="mt-3 text-primary">Total Staff</h4>
            <div class="big-count text-primary">{{TotalPostTypeStaffCount}}</div>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>
