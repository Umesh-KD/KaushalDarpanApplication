<main class="flex-1 p-6 space-y-6">

  <section class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-5">

    <div *ngFor="let row of EstablishmentDashboardTiles; let i = index">
      <div class="rounded-xl p-5 ring-1 ring-black/[0.03] shadow-soft hover:shadow-card transition-shadow main-data-box" 
        [ngClass]="row.bgClass">
        <div class="flex items-start gap-4">
          <div class="text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-sm flex-shrink-0"
            [ngClass]="row.bgClassIcon">
            <i [ngClass]="row.SRC"></i>
          </div>
          <div class="flex-1 min-w-0">
            <p class="text-sm font-semibold text-foreground leading-tight">{{row.TotalText}}</p>
            <p class="text-3xl font-bold mt-1 text-primary">{{row.TotalCount}}</p>
          </div>
        </div>
        <div class="mt-3 pt-3 border-t border-black/5 text-xs">
          <a [routerLink]="['/', row.URL]" [queryParams]="{ psid: row.Status }"
            class="inline-flex items-center gap-1 text-primary font-medium hover:underline">View all
            requests <i class="bi bi-arrow-right text-inherit"></i>
          </a>
        </div>
      </div>
    </div>
    
  </section>
  <section class="grid grid-cols-1 lg:grid-cols-2 gap-5">
    <div class="bg-card rounded-xl ring-1 ring-border shadow-soft p-5 new-card-header">
      <h3 class="font-semibold box-heading-mange mb-4">Attendance Trend <span
          class="text-muted-foreground font-normal">(May 2026)</span></h3>
      <div class="">

        <div class="flex items-center gap-4">
          <div class="w-50 h-50 flex-shrink-0">
            <div id="chartContainer2"></div>

          </div>
          <ul class="flex-1 space-y-2.5 text-sm">
            <li class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm"
                style="background:hsl(152 60% 45%)"></span><span class="flex-1">Approved</span><span
                class="font-semibold tabular-nums">2</span><span
                class="text-muted-foreground tabular-nums w-16 text-right">(<!-- -->66.67<!-- -->%)</span>
            </li>
            <li class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm"
                style="background:hsl(35 95% 55%)"></span><span class="flex-1">Pending</span><span
                class="font-semibold tabular-nums">1</span><span
                class="text-muted-foreground tabular-nums w-16 text-right">(<!-- -->33.33<!-- -->%)</span>
            </li>
            <li class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-sm"
                style="background:hsl(0 75% 55%)"></span><span class="flex-1">Rejected</span><span
                class="font-semibold tabular-nums">0</span><span
                class="text-muted-foreground tabular-nums w-16 text-right">(<!-- -->0.00<!-- -->%)</span>
            </li>
          </ul>
        </div>

      </div>
    </div>
    <div class="bg-card rounded-xl ring-1 ring-border shadow-soft p-5 new-card-header">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div *ngFor="let row of RelievingJoiningDashboardTiles; let i = index">
          <div class="rounded-xl p-4 flex flex-col items-center justify-center text-center ring-1 ring-black/[0.03]"
            [ngClass]="row.bgClass">
            <i [ngClass]="[row.SRC, row.bgClassIcon]"></i>
            <p class="text-3xl font-bold">{{row.TotalCount}}</p>
            <p class="text-xs text-muted-foreground mt-1 font-medium">{{row.TotalText}}</p>
          </div>
        </div>
