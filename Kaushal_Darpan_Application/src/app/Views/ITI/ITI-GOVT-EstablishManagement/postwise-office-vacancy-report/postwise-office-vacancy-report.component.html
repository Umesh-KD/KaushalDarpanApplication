<div class="modal-content">
  <div class="card">
    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5"><i class="ti ti-list"></i>Post Wise Office Vacancy Report</b>
      <div>
        <a href="javascript:void(0);"
           class="btn bg-info text-white me-1"
           (click)="exportToExcel()">
          <i class="ti ti-download"></i> Download Excel
        </a>

        <a href="javascript:void(0);"
           class="btn bg-danger text-white"
           (click)="exportToPDF()">
          <i class="ti ti-file-type-pdf"></i> Download PDF
        </a>
      </div>
    </div>
    <div class="overflow-x-auto mt-4">
      <table class="table table-bordered" *ngIf="OfficeVacancyList.length > 0">
        <thead>
          <tr>
            <th>S.No</th>
            <th>Service Category(Cadre)</th>
            <th>Name of Post</th>
            <th>Total Deployed Post</th>
            <th>Additional Post</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of OfficeVacancyList;  let idx = index">
            <td class="text-center">{{idx+1}}</td>
            <td>{{ row.ServiceCategory }}</td>
            <td>{{ row.NameOfPost }}</td>
            <td>
                <a [routerLink]="['/establishment-report-iti']" [queryParams]="{pid: row.DesignationID }" >
                    {{ row.DeployedPost }}
                </a>
            </td>
            <td>
                <a [routerLink]="['/establishment-report-iti']" [queryParams]="{pid: row.DesignationID, isAdditional: 1 }" >
                    {{ row.AdditionalPostCount }}
                </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
