    <div>
        <h4 class="text-slate-900 text-lg font-medium mb-2">ITI College Aprroved Contract</h4>

        <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
            <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Dashboard</a>
            <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
            <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">ITI College
                Aprroved Contract</a>
        </div>

<!-- Page Title End -->

<div class="card">
    <div class="card-body p-5">
        <div class="mb-8">
            <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
                <b class="text-1xl-5"><i class="ti ti-plus"></i> Add College Aprroved Contract</b>
                <div class="flex justify-end flex-wrap items-center">
                    <!-- <a routerLink="/iti-apprenticeship" class="btn bg-dark btn-sm text-white me-2"><i class="ti ti-chevron-left"></i>Back</a> -->
                </div>
            </div>
            <form [formGroup]="CollegeApprovedContractForm">
                <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">

                    <div>
                        <label class="text-gray-800 text-sm font-medium inline-block mb-1"> Zone: </label>
                        <select class="form-select"
                                name="DivisionID"
                                [(ngModel)]="this.request.DivisionID"
                                (change)="GetDistictData()"
                                formControlName="DivisionID">
                            <option [ngValue]="0">Choose option</option>
                            <option *ngFor="let item of Divisionlist" [ngValue]="item.ID">
                            {{ item.Name }}
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="text-gray-800 text-sm font-medium inline-block mb-1"> District: </label>
                        <select class="form-select "
                                [(ngModel)]="this.request.DistrictID"
                                formControlName="DistrictID"
                                (change)="onChange()">
                            <option value="0">Choose option</option>
                            <option *ngFor="let item of Districtlist" [value]="item.ID">
                            {{item.Name}}
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="text-gray-800 text-sm font-medium inline-block mb-1"> Month: </label>
                        <select class="form-select"
                                name="MonthID"
                                [(ngModel)]="this.request.MonthID"
                                (change)="GetInstituteMaster()"
                                formControlName="MonthID">
                            <option [ngValue]="0">Choose option</option>
                            <option *ngFor="let item of months" [ngValue]="item.id">
                            {{ item.name }}
                            </option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <div class="overflow-auto max-height500" *ngIf="Institutelist?.length > 0">
               <!-- <input type="number"
                                    [(ngModel)]="row.No_Of_Contract"

                    <tr>
                        <th class="text-left">Sr No</th>
                        <th class="text-left">Name of ITI</th>
                        <th class="text-left">Date</th>
                        <!-- <th class="text-left">No of Contract</th> -->
                    </tr>

                </thead>

                <tbody>
  <ng-container *ngFor="let row of Institutelist; let idx = index;">

    <!-- ROW 1 : Sr No | Name | Date -->
    <tr>
      <td class="text-left">{{ idx + 1 }}</td>
      <td class="text-left">{{ row.Name }}</td>
      <td>
        <input type="date"
               class="form-control"
               (change)="onDateChange($event.target.value, row)">
      </td>

      <!-- Empty cell to align table -->
      <!-- <td></td> -->
    </tr>

    <!-- ROW 2 : No of Contracts (full row below Name + Date) -->
    <tr>
      <td></td> <!-- blank for Sr No alignment -->
      <td colspan="2">

        <div *ngFor="let c of row.contracts; let i = index" class="flex items-center gap-2 mb-2">

          <span class="text-sm">{{ c.date }}</span>

          <input type="number" #cnt
                 [(ngModel)]="c.count"
                 name="contract_{{ row.InstituteID }}_{{ i }}"
                 min="0"
                 step="0.01"
                 class="form-control"
                 (ngModelChange)="onContractChange(c, row, cnt)"
                 placeholder="No of Contract"/>
 <!-- FILE UPLOAD CONTROL (ADDED HERE) -->
          <input type="file"
                 class="bg-blue-500 text-white text-sm py-1 px-2 rounded-md focus:outline-none"
                 (change)="onFileSelect($event, c, row)"
                 accept=".pdf,.jpg,.jpeg,.png" />
<a *ngIf="c.fileBase64" [href]="c.fileBase64" target="_blank">{{ c.fileName }}</a>
          <button type="button"
                  class="btn btn-danger"
                  (click)="removeContract(row, i)">X</button>

        </div>

      </td>
    </tr>

  </ng-container>
</tbody>
            </table>
        </div>
        <div class="flex justify-center">
            <button type="submit" class="btn bg-info text-white mt-6 me-1" (click)="SaveDataNew()">Submit</button>
            <!-- <button type="button" id="btnReset" (click)="ResetControl()" class="btn bg-danger text-white mt-6 me-1">
                <i class="ti ti-refresh"></i> Reset
            </button> -->
        </div>

    </div>
</div>
