<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
    <div>
        <h4 class="text-slate-900 text-lg font-medium mb-2">ITI College Aprroved Contract</h4>

        <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
            <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Dashboard</a>
            <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
            <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">ITI College
                Aprroved Contract</a>
        </div>
    </div>
</div>
<!-- Page Title End -->

<div class="card">
    <div class="card-body p-5">
        <div class="mb-8">
            <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
                <b class="text-1xl-5"><i class="ti ti-plus"></i> Add College Aprroved Contract</b>
                <div class="flex justify-end flex-wrap items-center">
                    <!-- <a routerLink="/iti-apprenticeship" class="btn bg-dark btn-sm text-white me-2"><i class="ti ti-chevron-left"></i>Back</a> -->
                </div>
            </div>
            <form [formGroup]="CollegeApprovedContractForm">
                <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">

                    <div>
                        <label class="text-gray-800 text-sm font-medium inline-block mb-1"> Zone: </label>
                        <select class="form-select" name="DivisionID" [(ngModel)]="this.request.DivisionID"
                            (change)="GetDistictData()" formControlName="DivisionID">
                            <option [ngValue]="0">Choose option</option>
                            <option *ngFor="let item of Divisionlist" [ngValue]="item.ID">
                                {{ item.Name }}
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="text-gray-800 text-sm font-medium inline-block mb-1"> District: </label>
                        <select class="form-select " [(ngModel)]="this.request.DistrictID" formControlName="DistrictID"
                            (change)="onChange()">
                            <option value="0">Choose option</option>
                            <option *ngFor="let item of Districtlist" [value]="item.ID">
                                {{item.Name}}
                            </option>
                        </select>
                    </div>

                    <div>
                        <label class="text-gray-800 text-sm font-medium inline-block mb-1"> Month: </label>
                        <select class="form-select" name="MonthID" [(ngModel)]="this.request.MonthID"
                            (change)="GetInstituteMaster()" formControlName="MonthID">
                            <option [ngValue]="0">Choose option</option>
                            <option *ngFor="let item of months" [ngValue]="item.id">
                                {{ item.name }}
                            </option>
                        </select>
                    </div>
                </div>
            </form>
        </div>

        <div class="overflow-auto max-height500" *ngIf="Institutelist?.length > 0">
            <!-- <input type="number"
                                    [(ngModel)]="row.No_Of_Contract"
                                    name="Institute_{{row.InstituteID}}"
                                    min="0"
                                    step="0.01"
                                    required
                                    class="form-control"/> -->
            <table class="w-full table-border" cellpadding="5">
                <thead class="bg-light/40 border-b border-gray-100 dark:bg-light/5 dark:border-b-gray-700">

                    <tr>
                        <th class="text-left">Sr No</th>
                        <th class="text-left">Name of ITI</th>
                        <th class="text-left">Date</th>
                        <!-- <th class="text-left">No of Contract</th> -->
                    </tr>

                </thead>

                    <tr *ngFor="let row of Institutelist; let idx = index;">

                            <td>
        <input type="date"
               class="form-control"
               (change)="onDateChange($event.target.value, row)">
      </td>
                        <td>
                         
                                    <div *ngFor="let c of row.contracts; let i = index" class="flex items-center gap-2 mb-2">

          <input type="number"  #cnt

                        </td>

                <tbody>
                    <ng-container *ngFor="let row of Institutelist; let idx = index;">
                        <tr>
                            <td class="text-left">{{ idx + 1 }}</td>
                            <td class="text-left">{{ row.Name }}</td>
                            <td>
                                <input type="date" class="form-control"
                                    (change)="onDateChange($event.target.value, row)">
                                <label class="ml-2 text-sm" style="padding-left:100px !important;">
                                    <input type="checkbox" [(ngModel)]="row.allowZero" name="allowZero_{{idx}}"
                                        (change)="onAllowZeroChange(row, $event)" />
                                    No Contract
                                </label>
                            </td>
                        </tr>
                        <tr *ngIf="row.contracts?.length > 0">
                            <td></td> 
                            <td colspan="2" class="p-0">
                                <table class="w-full border-collapse">
                                    <thead>
                                        <tr style="background-color: lavender;" class="font-semibold text-sm text-left h-10 border-b border-gray-200">
                                        <th class="px-4 py-2 w-1/4">Date</th>
                                        <th class="px-4 py-2 w-1/4">No of Contract</th>
                                        <th class="px-4 py-2 w-1/4">Upload Document</th>
                                        <th class="px-4 py-2 w-1/4 text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngFor="let c of row.contracts; let i = index" class="border-none last:border-0 hover:bg-gray-50/50">
                                        
                                        <td class="px-4 py-3 align-middle">
                                            <span class="text-sm text-gray-700">{{ c.date }}</span>
                                        </td>

                                        <td class="px-4 py-3 align-middle">
                                            <input 
                                            type="number" 
                                            #cnt 
                                            [(ngModel)]="c.count" 
                                            [disabled]="c.IsDisable"
                                            name="contract_{{ row.InstituteID }}_{{ i }}" 
                                            min="0" 
                                            step="0.01"
                                            class="form-control w-full border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:border-blue-500" 
                                            (ngModelChange)="onContractChange(c, row, cnt)"
                                            placeholder="No of Contract" 
                                            />
                                        </td>

                                        <td class="px-4 py-3 align-middle">
                                            <div>
                                                <div class="flex fileUploader">
                                                    <input class="block form-input w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
                                                        id="doc_{{ row.InstituteID }}_{{ i }}" type="file" (change)="onFileSelect($event, c, row)"  [disabled]="c.IsDisable">
                                                    <label for="doc_{{ row.InstituteID }}_{{ i }}">
                                                    <span>Choose File</span>
                                                    {{(c.fileName === '' || c.fileName == null || c.fileName == undefined) ? 'No File Choosen' : c.fileName}}
                                                    </label>
                                                    <div class="flex">
                                                    <a [href]="c.fileUrl"
                                                        *ngIf="c.fileName!='' || c.fileName != null || c.fileName != undefined " class="btn bg-primary text-white m-0" target="_blank"><i class="ti ti-eye"></i></a>
                                                    </div>
                                                </div>
                                            </div>
                                        </td>

                                        <td class="px-4 py-3 align-middle text-center">
                                            <button 
                                            type="button"
                                            class="w-8 h-8 inline-flex items-center justify-center rounded-full bg-red-500 text-white hover:bg-red-600 transition-colors shadow-sm"
                                            (click)="removeContract(row, i)"
                                            title="Delete Contract">
                                            <i class="ti ti-trash"></i>
                                            </button>
                                        </td>

                                        </tr>
                                    </tbody>
                                </table>
                            </td>
                        </tr>

                    </ng-container>
                </tbody>
            </table>
        </div>
        <div class="flex justify-center">
            <button type="submit" class="btn bg-info text-white mt-6 me-1" (click)="SaveDataNew()">Submit
            </button>
            <!-- <button type="button" id="btnReset" (click)="ResetControl()" class="btn bg-danger text-white mt-6 me-1">
                <i class="ti ti-refresh"></i> Reset
            </button> -->
        </div>

    </div>
</div>
