<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">ITI Bank Guarantee</h4>
  </div>
  <a routerLink="/iti-bank-guarantee-list" class="inline-flex items-center btn bg-dark text-white btn-sm"><i class="ti ti-chevron-left"></i> Back</a>
</div>

<!--Page Title End-->

<div class="card">
  <div class="card-body p-5">
    <div class="flex justify-between items-center mb-4 p-3 py-2 bg-light">
      <b class="text-1xl-5">ITI Bank Guarantee</b>
    </div>

    <form [formGroup]="bankGuarantee" >
      <div class="grid 2xl:grid-cols-3 xl:grid-cols-3 lg:grid-cols-2 md:grid-cols-2 grid-cols-1 gap-3">


        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">ITI Name</label>
          <ng-select [(ngModel)]="request.CollageId" [clearable]="false" formControlName="CollageId" (change)="bankGuaranteeAmount()">
            <ng-option [value]="0">--All--</ng-option>
            <ng-option *ngFor="let item of CompanyMasterList; trackBy: trackById"
                       [value]="item.ID">
              {{item.Name}}
            </ng-option>
          </ng-select>
        </div>

        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="BankName">Bank Name:<span class="StarMarking">*</span></label>
          <ng-select [(ngModel)]="request.BankID" [clearable]="false" formControlName="BankID">
            <ng-option [value]="0">--All--</ng-option>
            <ng-option *ngFor="let item of BankList; trackBy: trackById"
                       [value]="item.BankID">
              {{item.BankName}}
            </ng-option>
          </ng-select>
        </div>

        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="BankGuaranteeNumber">Bank Guarantee Number:<span class="StarMarking">*</span></label>
          <input style="text-transform:uppercase" formControlName="BankGuaranteeNumber" class="form-input" type="text" id="BankGuaranteeNumber"
                 placeholder="Bank Guarantee Number" [(ngModel)]="request.BankGuaranteeNumber">
          <div *ngIf="isSubmitted && bankGuarantee.get('BankGuaranteeNumber').errors" class="text-danger">
            <p *ngIf="bankGuarantee.get('BankGuaranteeNumber').errors.required">
              <i aria-hidden="true"></i>This field is
              required.
            </p>
          </div>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="dateOfIssue">Date Of Issue:<span class="StarMarking">*</span></label>
          <input formControlName="dateOfIssue" class="form-input" type="date" id="dateOfIssue" (change)="calculateDuration()"
                 (click)="openDatePicker($event)" placeholder="Date Of Issue" [(ngModel)]="request.dateOfIssue">
          <div *ngIf="isSubmitted && bankGuarantee.get('dateOfIssue').errors" class="text-danger">
            <p *ngIf="bankGuarantee.get('dateOfIssue').errors.required">
              <i aria-hidden="true"></i>This field is
              required.
            </p>
          </div>
        </div>
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="maturityDate">Maturity date:<span class="StarMarking">*</span></label>
          <input formControlName="maturityDate" class="form-input" type="date" id="maturityDate" (change)="calculateDuration()"
                 (click)="openDatePicker($event)" placeholder="Maturity date" [(ngModel)]="request.maturityDate">
          <div *ngIf="isSubmitted && bankGuarantee.get('maturityDate').errors" class="text-danger">
            <p *ngIf="bankGuarantee.get('maturityDate').errors.required">
              <i aria-hidden="true"></i>This field is
              required.
            </p>
          </div>
        </div>

        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="Amount">Amount:<span class="StarMarking">*</span></label>
          <input formControlName="amount" class="form-input" type="text" id="amount"
                 (keypress)="numberOnly($event)" placeholder="Amount" [(ngModel)]="request.amount">
          <div *ngIf="isSubmitted && bankGuarantee.get('amount').errors" class="text-danger">
            <p *ngIf="bankGuarantee.get('amount').errors.required">
              <i aria-hidden="true"></i>This field is
              required.
            </p>
          </div>
        </div>


        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="Duration">Duration:<span class="StarMarking">*</span></label>
          <input formControlName="duration" class="form-input" type="text" id="duration"
                 placeholder="Duration" [(ngModel)]="request.duration">
          <div *ngIf="isSubmitted && bankGuarantee.get('duration').errors" class="text-danger">
            <p *ngIf="bankGuarantee.get('duration').errors.required">
              <i aria-hidden="true"></i>This field is
              required.
            </p>
          </div>
        </div>

        <div>
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                 for="BankAgreementDocument">Bank Agreement Document</label>
          <div class="flex fileUploader">
            <input class="block form-input w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
                   id="BankAgreementDocument" formControlName="BankAgreementDocument" type="file" (change)="onFilechange($event,'bankDocument')">
            <label for="BankAgreementDocument">
              <span>Choose File</span>
              {{request.BankAgreementDocument === '' ? 'No File Choosen' : request.BankAgreementDocument}}
            </label>
            <div class="flex">
              <a href="{{appsettingConfig.StaticFileRootPathURL + '/' + request.BankAgreementDocument}}"
                 *ngIf="this.request.BankAgreementDocument !=''"
                 class="btn bg-primary text-white m-0" target="_blank"><i class="ti ti-eye"></i></a>
            </div>
          </div>



        </div>






        <div *ngIf="request?.BankGuaranteeID>0">
          <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white" for="remarks">Return Remark:</label>
          <!--<textarea formControlName="Remarks" class="form-input" placeholder="remarks" type="text" [(ngModel)]="request.Remarks">
    </textarea>-->

          <select class="form-select"
                  [(ngModel)]="request.Remarks" id="Remarks" formControlName="Remarks">
            <option value="">-- Select Remarks --</option>
            <option value="Return at Maturity">Return on maturity </option>
            <option value="Return on insitute closed">Return on insitute closed</option>
          </select>

        </div>

        <div *ngIf="request.Remarks!='' ||  request?.BankGuaranteeID>0 ">
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">
            Order No:
          </label>
          <input type="number" class="form-input" id="OrderNo" formControlName="OrderNo" (keypress)="numberOnly($event)"
                 [(ngModel)]="request.OrderNo" placeholder="Please Enter Order No">
          <!--<div *ngIf="isSubmitted&&_bankGuaranteeFormGroup.OrderNo.errors" class="text-danger">
            <p *ngIf="_bankGuaranteeFormGroup.OrderNo.errors.required"><i aria-hidden="true"></i> This field is required .!</p>
          </div>-->
        </div>
        <div *ngIf="request.Remarks!='' ||  request?.BankGuaranteeID>0 ">
          <label class="text-gray-800 text-sm font-medium inline-block mb-1">
            Order date:
          </label>
          <input type="date" class="form-input" id="Orderdate" formControlName="Orderdate"
                 [(ngModel)]="request.Orderdate"
                 min="1980-01-01"
                 max="2099-01-01">

          <!--<div *ngIf="isSubmitted&&_bankGuaranteeFormGroup.Orderdate.errors" class="text-danger">
            <p *ngIf="_bankGuaranteeFormGroup.Orderdate.errors.required"><i aria-hidden="true"></i> This field is required .!</p>
          </div>-->
        </div>



      </div>
     

      

      <div class="grid xl:grid-cols-1 lg:grid-cols-1 md:grid-cols-1 gap-6">
        <div class="text-center">
          <button type="submit" (click)="saveData()" class="btn bg-info text-white mt-6 me-1">Save</button>

          <!-- Insert -->
          <!--<button type="submit" class="btn bg-info text-white mt-6 me-1" (click)="saveData('INSERT')">Save</button>-->

          <!-- Update -->
          <!--<button type="submit" class="btn bg-info text-white mt-6 me-1" (click)="saveData('UPDATE')">Update</button>-->

          <!-- Renew -->
          <!--<button type="submit" class="btn bg-info text-white mt-6 me-1" (click)="saveData('ReNew')">Renew</button>-->


          <button type="button" id="btnReset" (click)="ResetControl()" class="btn bg-danger text-white">
            <i class="ti ti-refresh"></i> Reset
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
