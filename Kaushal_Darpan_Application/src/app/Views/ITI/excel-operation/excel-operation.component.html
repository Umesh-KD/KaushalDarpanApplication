<!-- Page Title Start -->

<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Excel Operation</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Excel Operation</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">BulkExcel Operation </a>
    </div>
  </div>
    <!-- <a (click)="Back()" class="inline-flex items-center btn bg-dark text-white btn-sm"><i
      class="ti ti-chevron-left"></i>
    Back</a> -->
    <!-- <a (click)="Back()" class="inline-flex items-center btn bg-dark text-white btn-sm"><i class="ti ti-chevron-left"></i>Back</a> -->
</div>
<!-- Page Title End -->


<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <!-- justify-end  -->
      <div class="flex  flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <div class="flex justify-between items-center ">
          <div class="flex items-center me-3">
            <label class="block me-2 text-sm font-medium text-gray-900 dark:text-white items-center"
                   for="fileStudentPhoto">Import Excel</label>
            <div class="flex fileUploader bg-gray-100 items-center">
              <!-- (change)="onFileChange($event)" -->
              <input class="bg-blue-500 text-white text-sm py-1 px-2 rounded-md focus:outline-none" (change)="onFileChange($event)" [(ngModel)]="importFile"
                     id="fileStudentPhoto" type="file" accept=".xls,.xlsx">
              <label for="fileStudentPhoto">
                <span>Choose File</span>
                {{selectedFile ? selectedFile.name : 'No file chosen'}}
              </label>
            </div>
          </div>


          <div class="flex items-center me-3">
            <!-- <div class="me-3"> -->
            <label class="block me-2 text-sm font-medium text-gray-900 dark:text-white items-center" for="ChunkSize"><span>ChunkSize</span></label>
            <input type="text" class="form-input" placeholder="Enter ChunkSize" id="ChunkSize" name="ChunkSize"
                   [(ngModel)]="ChunkSize">
            <!-- </div> -->
          </div>

          <div class="flex items-center me-3"> 
            <label class="block me-2 text-sm font-medium text-gray-900 dark:text-white items-center"> Action Type </label>
            <select class="form-select" id="LeaveID" name="ActionType" [(ngModel)]="ActionType" >
              <option value="0">-- Select --</option>
              <option *ngFor="let item of ActionList" [value]="item.ActionName">{{item.ActionName}}</option>
            </select>            
          </div>


          <button type="button" class=" btn bg-info text-white " (click)="ImportExcelFile(selectedFile)">Submit</button>

          <!-- <a href="javascript:void(0);" class="btn bg-info btn-sm text-white" (click)="DownloadExcelSample()"><i class="ti ti-download"></i> Sample Format</a> -->
        </div>
       
      </div>

    </div>
 
  </div>

</div>
