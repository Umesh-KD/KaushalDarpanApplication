<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Add Sanction Order</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <!--<a href="/AdminDashboardITI" class="text-sm font-medium text-slate-700">Dashboard</a>-->
      <a class="text-sm font-medium text-slate-700">Dashboard</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <!--<a href="/ITICollageTrade" class="text-sm font-medium text-slate-700" aria-current="page">ITI Collage Report</a>-->
      <a class="text-sm font-medium text-slate-700" aria-current="page">Add Sanction Order</a>
    </div>


  </div>
</div>
<div class="card">
  <div class="card-body p-5">

    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light mt-4">
      <b class="text-1xl-5"><i class="ti ti-plus"></i>Add Sanction Details</b>
      <a routerLink="/SanctionOrderList" class="btn bg-info btn-sm text-white me-2">
        <i class="ti ti-plus"></i>Back
      </a>
    </div>
    <div class="grid xl:grid-cols-3 lg:grid-cols-3 md:grid-cols-2 sm:grid-col-1 gap-3 ">



      <div *ngIf="sSOLoginDataModel.RoleID!=_enumrole.DTE_TrainingT2_establishment">
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">Sanction Type: <span class="StarMarking">*</span></label>
        <select class="form-select" id="CollegeID" [(ngModel)]="request.ParentID" (change)="GetOrderList()">

          <option value="0">--Select--</option>
          <option value="1">Administrative Sanction</option>
          <option value="2">Financial Sanction</option>
          <option value="3">Post Sanction</option>
       
        </select>

      </div>


      <div *ngIf="sSOLoginDataModel.RoleID==_enumrole.DTE_TrainingT2_establishment">
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">Sanction Type: <span class="StarMarking">*</span></label>
        <select class="form-select" id="CollegeID" [(ngModel)]="request.ParentID" (change)="GetOrderList()">

          <option value="0">--Select--</option>
    
          <option value="4">Transfer Sanction</option>
        </select>

      </div>


      <div >
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">Order Type: <span class="StarMarking">*</span></label>
        <select class="form-select" id="CollegeID" [(ngModel)]="request.OrderType">
          <option value="0">--Select--</option>
          <option *ngFor="let item of OrderList" [value]="item.ID">{{item.Name}}</option>
        </select>

      </div>
      <div>
        <label for="ApplicationId" class="text-gray-800 text-sm font-medium inline-block mb-2">Order No<span class="StarMarking">*</span></label>
        <input type="text" class="form-input" id="ApplicationId" [(ngModel)]="request.OrderNo" placeholder="Enter Post Sanction Order No">
        <!--<div *ngIf="isSubmitted && _ReportForm.SanctionOrderNo.errors" class="text-danger">
      <p *ngIf="_ReportForm.SanctionOrderNo.errors.required"><i aria-hidden="true"></i>This field is required.!</p>
    </div>-->

      </div>
      <div>
        <label for="ApplicationId" class="text-gray-800 text-sm font-medium inline-block mb-2">Order Date<span class="StarMarking">*</span></label>
        <input type="date" class="form-input" id="ApplicationId" [(ngModel)]="request.OrderDate">
        <!--<div *ngIf="isSubmitted && _ReportForm.SanctionOrderDate.errors" class="text-danger">
      <p *ngIf="_ReportForm.SanctionOrderDate.errors.required"><i aria-hidden="true"></i>This field is required.!</p>
    </div>-->
      </div>




      <div>
        <label class="text-gray-800 text-sm font-medium inline-block mb-1">Order Copy<span class="StarMarking">*</span> </label>
        <div class="flex fileUploader">
          <input class="block form-input w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
                 id="SanctionOrderCopy" type="file" (change)="onFilechange($event,'SanctionOrderCopy')" />

          <label for="SanctionOrderCopy">
            <span>Choose File</span>
            {{ request.OrderCopy === '' ? 'No File Chosen' : request.OrderCopy }}
          </label>
          <div class="flex">
            <a href="{{appsettingConfig.StaticFileRootPathURL + '/' + request.OrderCopy}}"
               *ngIf="this.request.OrderCopy  !=''"
               class="btn bg-primary text-white m-0" target="_blank"><i class="ti ti-eye"></i></a>
            <!--<a href="javascript:void(0)" class="btn bg-danger text-white m-0"
        (click)="DeleteImage(staffDetailsFormData.ProfilePhoto,'Photo')"
        *ngIf="this.staffDetailsFormData.ProfilePhoto !=''"><i class="ti ti-trash"></i></a>-->
          </div>

        </div>
      </div>


      <div class="col-span-3 text-center">
        <button type="button" class="btn bg-info text-white mt-6" (click)="SaveData()">Submit</button>
        <button type="button" class="btn bg-danger text-white mt-6" (click)="ResetControls()"><i class="ti ti-refresh"></i> Reset</button>
      </div>



    </div>
    </div>
    </div>
