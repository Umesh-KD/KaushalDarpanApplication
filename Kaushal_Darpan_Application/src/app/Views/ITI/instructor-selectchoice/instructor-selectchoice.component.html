<head>
  <link href="/assets/KD5/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/assets/KD5/css/Style.css?2" rel="stylesheet" />
</head>



<div class="card-body p-5">


  <div *ngIf="AddedChoices.length > 0">
    <div class="flex justify-between items-center flex-wrap mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5">Selected College List</b>
    </div>

    <div class="overflow-auto">
      <table class="w-full table-border" cellpadding="5">
        <thead class="bg-light/40 border-b border-gray-100 dark:bg-light/5 dark:border-b-gray-700">
          <tr>
            <th>Priority</th>
            <!--<th>Trade Level</th>-->
            <th>Name of College</th>
            <th>Branch Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of AddedChoices; let idx = index">
            <td class="text-left">{{row.Priority}}</td>
            <!--<td class="text-center">{{row.TradeLevel}}th</td>-->
            <td class="text-left">{{row.InstituteName}}</td>
            <td class="text-left">{{row.TradeName}}</td>
            <td class="text-left">
              <!--<button class="btn bg-danger text-white" type="button" title="Delete" (click)="DeleteOptionByID(row)">
                <i class="ti ti-trash"></i>
              </button>-->
              <button class="btn bg-primary text-white" type="button" title="Priority Up" (click)="PriorityChange(row)">
Join
              </button>
              <!--<button class="btn bg-info text-white" type="button" title="Priority Down" (click)="PriorityChange(row, 'DOWN')" [disabled]="idx === AddedChoices8.length - 1">
                <i class="ti ti-arrow-narrow-down"></i>
              </button>-->
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Trade Level 10 List -->



</div>
<div class="card-footer text-center">
  <button type="button" class="btn bg-info text-white" (click)="Back()"><i class="ti ti-chevron-left"></i>Back</button>
  <button type="button" class="btn bg-primary text-white" (click)="OnFinalSubmit()"><i class="ti ti-device-floppy"></i>Final Submit</button>
  <!-- <button type="button" class="btn bg-light text-dark" (click)="ResetOptions()"><i class="ti ti-refresh"></i>Reset</button> -->
</div>
