
<app-loader></app-loader>
<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Hostel Fee</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Dashboard</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Hostel Fee</a>
    </div>
  </div>
</div>



<div class="card">
  <div class="card-body p-5">
    <div class="mb-8">
      <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
        <b class="text-1xl-5"><i class="ti ti-plus"></i> Add Hostel Fee</b>
      </div>
      <form [formGroup]="requestFormGroup">
     

        <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">
          <div>
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">
              Caution Fee: <span class="StarMarking">*</span>
            </label>
            <input type="number" maxlength="5" placeholder="Caution Fee" class="form-input" id="Cautionfee" name="Cautionfee"
                   formControlName="Cautionfee" [(ngModel)]="request.Cautionfee">
            <div *ngIf="isSubmitted && _requestFormGroup.Cautionfee.errors?.required" class="text-danger">
              <p>This field is required!</p>
            </div>
          </div>
          <div>
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">
              Hostel Fee: <span class="StarMarking">*</span>
            </label>
            <input type="number" maxlength="5" placeholder="Hostel Fee" class="form-input" id="HostelFee" name="HostelFee"
                   formControlName="HostelFee" [(ngModel)]="request.HostelFee">
            <div *ngIf="isSubmitted && _requestFormGroup.HostelFee.errors?.required" class="text-danger">
              <p>This field is required!</p>
            </div>
          </div>

          <div>
            <button type="button" class="btn bg-info text-white mt-6" id="btnSave" (click)="saveData1()">Submit</button>
            <button type="button" class="btn bg-danger text-white mt-6" id="btnReset" (click)="ResetControl()">Reset</button>
          </div>
        </div>
      </form>

    </div>
    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5"><i class="ti ti-list"></i> Hostel Fee List</b>
    </div>
    <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">
      <div class="">
        <select id="ddlConter" class="form-select  couterDropDown">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="">
      </div>
      <div class="">
      </div>
      <div class="">
        <input class="form-input" placeholder="Search....." [(ngModel)]="Table_SearchText" />
      </div>
    </div>
    <div class="overflow-x-auto mt-3">
      <table class="table table-border w-full table-auto" cellpadding="5">
        <thead class="bg-light/40 border-b border-gray-100 dark:bg-light/5 dark:border-b-gray-700 h-10">
          <tr>
            <th class="text-left">Sr. No.</th>
            <th class="text-center">Caution Fee</th>
            <th class="text-center">Hostel Fee</th>
            <th class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of HostelFeeList  | tableSearchFilter:Table_SearchText;let idx=index;">
            <td align="left">{{idx+1}}</td>
            <td align="left">{{row.Cautionfee}}</td>
            <td align="left">{{row.HostelFee}}</td>
            <td>
              <div class="flex align-center justify-center actionBtns w-auto" style="width:auto !important">
                <a href="javascript:void(0)" (click)="GetHostelFeeByID(row.HostelFeeId)" title="Edit"><i class="ti ti-pencil"></i></a>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
