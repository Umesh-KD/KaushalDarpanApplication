
<app-loader></app-loader>
<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Reports</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Dashboard</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Reports</a>
    </div>
  </div>
</div>
<div class="card">
  <div class="card-body p-5">
   
    <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
      <b class="text-1xl-5"><i class="ti ti-list"></i>Search Results</b>
      <div class="flex justify-end flex-wrap items-center">
        <a  *ngIf="IsShowAddButton" [routerLink]="'/Hostel-Institute-Mapping'" class="btn bg-info btn-sm text-white">
          <i class="ti ti-plus"></i> Add Mapping
        </a>
      </div>
    </div>
    <div class="grid 2xl:grid-cols-4 xl:grid-cols-4 lg:grid-cols-3 md:grid-cols-2 grid-cols-1 gap-3">
      <div class="">
        <select id="ddlConter" class="form-select  couterDropDown">
          <option value="50">50</option>
          <option value="100">100</option>
          <option value="500">500</option>
          <option value="1000">1000</option>
        </select>
      </div>
      <div class="">
      </div>
      <div class="">
      </div>
      <div class="">
        <input class="form-input" placeholder="Search....." [(ngModel)]="Table_SearchText" />
      </div>  
    </div>
    <div class="overflow-x-auto mt-3">
      <table class="table table-border w-full table-auto" cellpadding="5">
        <thead class="bg-light/40 border-b border-gray-100 dark:bg-light/5 dark:border-b-gray-700 h-10">
          <tr>
            <th class="text-left">SNo</th>
            <th class="text-left">Hostel Name</th>
            <th class="text-left">Institute Name</th>
            <th class="text-left">Parent Type</th>
            <th class="text-center">Action</th>

          </tr>
        </thead>

        <!--{{HostelInstituteMappingList | json}}-->
      <tbody>
        <tr *ngIf="HostelInstituteMappingList?.length === 0">
          <td colspan="5" class="text-center">No record found</td>
        </tr>

        <tr *ngFor="let item of HostelInstituteMappingList;let idx=index;">
          <td>{{idx+1}}</td>
          <td>{{item.HostelName}}</td>
          <td>{{item.InstituteNames}}</td>
          <td>
            <span *ngIf="item.isParent == 1">Map Hostel</span>
          </td>
          <td>
            <!--<button class="btn btn-danger btn-sm" (click)="unmapHostel(item.HIMappingID)">
        Unmap
      </button>-->

            <div class="flex align-center justify-center actionBtns w-auto" style="width: auto !important;">

              <a *ngIf="item.isParent == 1" class="btn btn-danger btn-sm" (click)="editMapping(item.HIMappingID)">
                <i class="fa fa-pencil"></i>
              </a>
            </div>



          </td>
        </tr>
      </tbody>
      </table>
    </div>

  </div>
</div>

<!-- end row -->
