<div class="container-fluid px-3">
  <div class="dashboard-wrapper">

    <!-- Welcome Header -->
    <div class="dash-header d-flex align-items-center justify-content-between mb-4 px-1">
      <div>
        <h4 class="dash-welcome mb-0">Welcome back, <span class="highlight-name">{{ sSOLoginDataModel?.DisplayName || 'Instructor' }}</span> 👋</h4>
        <p class="text-muted small mb-0">Here's what's happening with your activities.</p>
      </div>
      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-white border text-secondary px-3 py-2 rounded-pill shadow-sm">
          <i class="bi bi-calendar3 me-1"></i> {{ InstituteName || 'Institute' }}
        </span>
      </div>
    </div>

    <!-- Filters -->
    <div class="d-flex align-items-center gap-3 mb-4 flex-wrap">
      <div class="filter-group">
        <label class="filter-label">Month</label>
        <select class="filter-select" [(ngModel)]="searchRequest1.Month" (change)="onFilterChange()">
          <option *ngFor="let m of monthList" [value]="m.value">{{ m.label }}</option>
        </select>
      </div>
      <!--<div class="filter-group">
        <label class="filter-label">Year</label>
        <select class="filter-select" [(ngModel)]="searchRequest1.Year" (change)="onFilterChange()">
          <option *ngFor="let y of yearList" [value]="y">{{ y }}</option>
        </select>
      </div>-->
    </div>

    <!-- TOP CARDS — 4 in a row -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-lg-3" *ngFor="let item of dashboardData.TOPCARD; let i = index">
        <div class="dash-topcard shadow-sm" [ngClass]="'topcard-' + i">
          <div class="d-flex align-items-start justify-content-between">
            <div class="topcard-icon-wrap" [ngClass]="'icon-wrap-' + i">
              <i class="bi" [ngClass]="getTopCardIcon(item.icon || item.menuCode)"></i>
            </div>
            <span *ngIf="item.statusText" class="badge topcard-status-badge">{{ item.statusText }}</span>
          </div>
          <div class="mt-3">
            <div class="topcard-value">
              {{ item.totalCount | number:'1.0-0' }}<span *ngIf="item.title === 'Attendance'" class="topcard-unit">%</span>
            </div>
            <div class="topcard-label">{{ item.title }}</div>
          </div>
          <div class="mt-2" *ngIf="item.url">
            <a [href]="'/' + item.url" class="topcard-link">View all <i class="bi bi-arrow-right"></i></a>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
