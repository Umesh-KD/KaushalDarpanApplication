  <!-- Page Title Start -->

<div class="flex items-center justify-between flex-wrap gap-2 mb-6">
  <div>
    <h4 class="text-slate-900 text-lg font-medium mb-2">Apply Leave</h4>

    <div class="md:flex hidden items-center gap-3 text-sm font-semibold">
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700">Master</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a href="javascript:void(0);" class="text-sm font-medium text-slate-700" aria-current="page">Apply Leave</a>
      <i class="material-symbols-rounded text-xl flex-shrink-0 text-slate-500">chevron_right</i>
      <a routerLink="/Hrmaster" class="text-sm font-medium text-slate-700" aria-current="page">Apply Leave</a>
    </div>
  </div>
  <a (click)="Back()" class="inline-flex items-center btn bg-dark text-white btn-sm"><i class="ti ti-chevron-left"></i> Back</a>
</div>

<div>
<form [formGroup]="LeaveMasterFormGroup" id="LeaveMasterFormGroup" class="form-horizontal">
  <div class="card">
    <div class="card-body p-5">
      <div class="mb-8">
        <div class="flex justify-between flex-wrap items-center mb-3 p-3 py-2 bg-light">
          <b class="text-1xl-5"><i class="ti ti-plus"></i> Add Apply Details</b>
        </div>
        <div class="grid xl:grid-cols-3 lg:grid-cols-3 md:grid-cols-2 gap-6">

          <div>
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">Leave Type  <span class="StarMarking">*</span></label>
            <select class="form-select" id="LeaveID" name="LeaveID" [(ngModel)]="request.LeaveID" formControlName="LeaveID" (change)="calculateDays()">
              <option value="0">-- Select --</option>
              <option *ngFor="let item of LeaveTypeList" [value]="item.ID">{{item.Name}}</option>
            </select>
            <div *ngIf="isSubmitted && _LeaveMasterFormGroup.LeaveID.errors" class="text-danger">
              <p *ngIf="!_LeaveMasterFormGroup.LeaveID.errors.DropdownValidators"><i aria-hidden="true"></i>This field is required.!</p>
            </div>
          </div>

          <div *ngIf="request.LeaveID!=0">   
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">Remaining Leave</label>
            <input type="text" [(ngModel)]="LeaveBlance" formControlName="RemainingLeave" class="form-input"/>
          </div>

          <div>
            <label class="text-gray-800 text-sm font-medium inline-block mb-1">Leave Type F S F <span class="StarMarking">*</span></label>
            <select class="form-select" id="LeaveTypeID" name="LeaveTypeID" [(ngModel)]="request.LeaveTypeID" formControlName="LeaveTypeID" (change)="calculateDays()">
              <option value="0">-- Select --</option>
              <option *ngFor="let item of LeaveTypeFSFList" [value]="item.ID">{{item.Name}}</option>
            </select>
            <div *ngIf="isSubmitted && _LeaveMasterFormGroup.LeaveTypeID.errors" class="text-danger">
              <p *ngIf="!_LeaveMasterFormGroup.LeaveTypeID.errors.DropdownValidators"><i aria-hidden="true"></i>This field is required.!</p>
            </div>
          </div>


          <div>
            <label>From Date <span class="StarMarking">*</span> </label>
            <input type="date" class="form-input" id="txtFromDate" formControlName="txtFromDate"
                   [(ngModel)]="request.From_Date" (change)="calculateDays()" [min]="today" 
                   [max]="maxDate" (keydown)="$event.preventDefault()" />
            <div *ngIf="isSubmitted && _LeaveMasterFormGroup.txtFromDate.errors"
                 class="text-danger">
              <p *ngIf="_LeaveMasterFormGroup.txtFromDate.errors.required">
                <i aria-hidden="true"></i>This field is required.!
              </p>
            </div>
          </div>
          <div>
            <label>To Date <span class="StarMarking">*</span> </label>
            <input type="date" class="form-input" id="txtToDate" formControlName="txtToDate"
                   [(ngModel)]="request.To_Date" (change)="calculateDays()" [min]="today"
                   [max]="maxDate" (keydown)="$event.preventDefault()"/>
            <div *ngIf="isSubmitted && _LeaveMasterFormGroup.txtToDate.errors"
                 class="text-danger">
              <p *ngIf="_LeaveMasterFormGroup.txtToDate.errors.required">
                <i aria-hidden="true"></i>This field is required.!
              </p>
            </div>
          </div>

          <div>
            <label>Remarks <span class="StarMarking">*</span></label>
            <textarea type="text"
                      class="form-input"
                      id="txtToDate"
                      formControlName="remark"
                      [(ngModel)]="request.Remark">
            </textarea>

            <div *ngIf="isSubmitted && _LeaveMasterFormGroup.remark.errors"
                 class="text-danger">
              <p *ngIf="_LeaveMasterFormGroup.remark.errors.required">
                <i aria-hidden="true"></i>This field is required.!
              </p>
            </div>
          </div>

        <!-- IsHeadQuarter checkbox -->
        <div>   
          <label class="inline-flex items-center">
            <input type="checkbox" [(ngModel)]="request.IsHeadQuarter" formControlName="IsHeadQuarter" class="form-checkbox" (change)="IsHeadQuarter()" />
            <span class="ml-2 text-gray-800 text-sm font-medium">Is Head Quarter</span>
          </label>
        </div>
       
        <div *ngIf="request.IsHeadQuarter" >
          <label>Address<span class="StarMarking">*</span></label>
          <textarea type="text"
                    class="form-input"
                    id="txtIsHeadQuarterAddress"
                    formControlName="txtIsHeadQuarterAddress"
                    [(ngModel)]="request.txtIsHeadQuarterAddress">
          </textarea>

          <div *ngIf="isSubmitted && _LeaveMasterFormGroup.txtIsHeadQuarterAddress.errors"
               class="text-danger">
            <p *ngIf="_LeaveMasterFormGroup.txtIsHeadQuarterAddress.errors.required">
              <i aria-hidden="true"></i>This field is required.!
            </p>
          </div>
        </div>

        <div *ngIf="request.IsHeadQuarter" >
          <label for="txtMobileNumber" class="text-gray-800 text-sm font-medium inline-block mb-2">Mobile Number:<span class="StarMarking">*</span></label>
          <input type="text" class="form-input" id="txtIsHeadQuarterMobileNo" placeholder="Enter 10 Digits Mobile Number" [(ngModel)]="request.txtIsHeadQuarterMobileNo" formControlName="txtIsHeadQuarterMobileNo" maxlength="10" (input)="onInput($event)">
          <div *ngIf="isSubmitted && _LeaveMasterFormGroup.txtIsHeadQuarterMobileNo.errors"
               class="text-danger">
            <p *ngIf="_LeaveMasterFormGroup.txtIsHeadQuarterMobileNo.errors.required">
              <i aria-hidden="true"></i>This field is required.!
            </p>
          </div>
        </div>


          <div>
            <label>Total Leave Deduction(in Days) </label>
            <input type="text" class="form-input" id="txtToDate" formControlName="TotalDays"
                   [(ngModel)]="request.TotalDays" />
          </div>

          <!-- upload documnet  -->

          <div >
            <label class="block mb-2 text-sm font-medium text-gray-900 dark:text-white"
                   for="fileStudentPhoto">Upload Document</label>
            <div class="flex fileUploader">
              <input class="block form-input w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400"
                     id="fileStudentPhoto" type="file" (change)="onDocchange($event,'Photo')">
              <label for="fileStudentPhoto">
                <span>Choose File</span>
                {{request.DisUploadDoc === '' ? 'No File Choosen' : request.DisUploadDoc}}
              </label>
              <div class="flex">
                <a href="{{appsettingConfig.StaticFileRootPathURL + '/' + request.UploadDoc}}"
                   *ngIf="this.request.UploadDoc!='' " class="btn bg-primary text-white m-0" target="_blank"><i class="ti ti-eye"></i></a>
                <!--<a href="javascript:void(0);" class="btn bg-danger text-white m-0"
                   (click)="DeleteImage(request.CompanyPhoto,'Photo')" *ngIf="this.request.CompanyPhoto !=''">
                  <i class="ti ti-trash"></i>
                </a>-->
              </div>
            </div>
          </div>
          <div class="col-span-3 text-center">
            <button type="button" class="btn bg-info text-white mt-6" (click)="SaveData()">Submit</button>
            <button type="button" class="btn bg-danger text-white mt-6" (click)="ResetControls()"><i class="ti ti-refresh"></i> Reset</button>
          </div>

        </div>


      </div>
    </div>

  </div>
</form>
</div>
