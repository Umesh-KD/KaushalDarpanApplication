<!--Start Model Popup-->
<ng-template #modal_UserLoginType let-modal class=" h-full fixed top-0 left-0 z-[80] transition-all duration-500 overflow-y-auto [--overlay-backdrop:static]">
  <div class="modal-content">
    <div class="card">
      <div class="card-header flex justify-between  items-center">
        <b>
          <i class="fa fa-exchange"></i>&nbsp; Please Select User Type
        </b>
       
      </div>
      <div class="card-body">
        <div class="mt-4">

          <table class="table table-border w-full table-auto" cellpadding="5">
            <tr>
              <td>
                Sr No
              </td>
              <td>
                User Type
              </td>
              <td>
                Action
              </td>
            </tr>
            <tr>
              <td>
                1.
              </td>
              <td>
                ITI College
              </td>
              <td>
                <a routerLink="/ITICollegeSSOMapping" (click)="CloseModal()" class="btn bg-info btn-sm text-white text-center c-pointer">Proceed <i class="ti ti-chevron-right"></i></a>
              </td>
            </tr>
            <tr>
              <td>
                2.
              </td>
              <td>
                Student/Trainee
              </td>
              <td>
                <a href="javascript:void(0);" (click)="UpdateStudentUserType()" class="btn bg-info btn-sm text-white text-center c-pointer">Proceed <i class="ti ti-chevron-right"></i></a>
              </td>
            </tr>
            <tr>
              <td>
               3.
              </td>
              <td>
                Candidate
              </td>
              <td>
                <a routerLink="/CandidateSsoMapping" (click)="CloseModal()" class="btn bg-info btn-sm text-white text-center c-pointer">Proceed <i class="ti ti-chevron-right"></i></a>
              </td>
            </tr>
          </table>
        </div>
      </div>
      <div class="text-center flex items-center justify-center mt-3">
      </div>
      <br />
    </div>
  </div>
</ng-template>

<!-- multi department -->
<ng-template #modal_MultiDepartment let-modal class="w-full h-full fixed top-0 left-0 z-[80] transition-all duration-500 overflow-y-auto [--overlay-backdrop:static] hidden">
  <div class="modal-content">
    <div class="card">
      <div class="card-header flex justify-between  items-center">
        <b class="text-2xl"><i class="fa fa-plus"></i>&nbsp;Please Select Department </b>
        <button class="btn bg-info text-white" (click)="CloseUserDepartmentModal()"><i class="ti ti-x"></i></button>
      </div>
      <div class="card-body">
        <div class="p-6">

          <div class="grid xl:grid-cols-12 loginBox">
            <table class="table table-border w-full table-auto" cellpadding="5">
              <tr>
                <th>
                  Department
                </th>
                <th>
                  Action
                </th>
              </tr>
              <tr>
                <td>
                  BTER
                </td>
                <td>
                  <a href="javascript:void(0);" class="btn bg-info btn-sm text-white text-center c-pointer" (click)="SetUserDepartmentAndProceed(_EnumDepartment.BTER)">Proceed <i class="ti ti-chevron-right"></i></a>
                </td>
              </tr>
              <tr>
                <td>
                  ITI
                </td>
                <td>
                  <a href="javascript:void(0);" class="btn bg-info btn-sm text-white text-center c-pointer" (click)="SetUserDepartmentAndProceed(_EnumDepartment.ITI)">Proceed <i class="ti ti-chevron-right"></i></a>
                </td>
              </tr>
            </table>

          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
